module: toddr
display_name: "Audio TODDR (FIFO)"
condition:
  any_of:
    - "toddr.A.imp"
    - "toddr.B.imp"
    - "toddr.C.imp"
    - "toddr.D.imp"
    - "toddr.E.imp"

overview: |
  TODDR (To DDR) is the audio capture DMA engine that transfers incoming PCM samples from various
  audio sources (TDMIN, SPDIFIN, PDM, Loopback, Resample, etc.) to system memory. It implements
  a ring buffer mechanism with ping-pong capability, configurable interrupt watermarks, and
  flexible sample format conversion.

  The module bridges the audio domain (`sysclk`) to the memory bus via an internal FIFO, handling
  flow control, format packing, and address management autonomously. Each TODDR instance can
  connect to any audio source via the source selection mux.

  FIFO depth is `{fifo_depth}×64` bits for enabled instance(s), providing sufficient buffering
  for interrupt latency and DMA burst granularity.

features: |
  - Configurable FIFO depth: `{fifo_depth}×64` bits per instance.
  - Flexible source selection: TDMIN A/B/C, SPDIFIN, PDM, Resample A/B, Loopback A/B, eARC RX, VAD, etc.
  - Ring buffer operation with start/finish address boundaries.
  - Ping-pong (double buffer) mode for seamless buffer switching.
  - Programmable sample format: configurable bit slice [m:n] extraction.
  - 64-bit packing with selectable endianness.
  - Multiple interrupt sources: buffer full, threshold, address match, FIFO overflow.
  - Interrupt watermark address for partial buffer notifications.
  - Force-finish command for graceful stop with address alignment.
  - Extended 34-bit addressing for >4GB memory systems (`AADDR` register).
  - VAD (Voice Activity Detection) address capture for wake-word localization.
  - Channel number synchronization for multi-stream alignment (`CHNUM_ID` registers).
  - Hold-read mode for FIFO priming before enable.
  - Optional channel ID insertion into sample LSBs.

