module: loopback
display_name: "Audio Loopback (AEC)"
condition:
  any_of:
    - "loopback.A.imp"
    - "loopback.B.imp"

overview: |
  The Audio Loopback module merges two independent audio streams into a single interleaved output,
  primarily designed for Acoustic Echo Cancellation (AEC) applications. It combines the microphone
  input (near-end) with the speaker output reference (far-end) into a time-aligned multi-channel
  stream that can be processed by an AEC algorithm.

  The module supports flexible source selection and channel mapping, enabling various merge scenarios
  such as: mic + speaker reference, multi-mic arrays with playback reference, or any two audio sources
  requiring sample-accurate interleaving.

  Each instance supports up to `{ch}` channels of merged output.

features: |
  - Merges two independent audio sources into single interleaved output.
  - Flexible source selection for both "data" (original) and "loopback" paths.
  - Per-source selection: TDMIN, SPDIFIN, PDM, Resample, Loopback, eARC RX, VAD, etc.
  - Up to `{ch}` channels per enabled instance.
  - Per-channel ID mapping for stream synchronization.
  - Configurable bit slice extraction for both paths ([m:n] selection).
  - Sign extension option for narrower samples.
  - Channel number synchronization with buffer or drop modes.
  - Dual rate mode: output at data rate or loopback rate.
  - Per-channel mask and ID configuration (16 channels each path).
  - Hold insertion mode for delayed loopback injection.
  - Error detection with configurable stability masking.

