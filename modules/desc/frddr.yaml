module: frddr
display_name: "Audio FRDDR (FIFO)"
condition:
  any_of:
    - "frddr.A.imp"
    - "frddr.B.imp"
    - "frddr.C.imp"
    - "frddr.D.imp"
    - "frddr.E.imp"

overview: |
  FRDDR (From DDR) is the audio playback DMA engine that transfers PCM samples from system memory
  to audio output modules (TDMOUT, SPDIFOUT, EQ/DRC, Mixer). It implements a ring buffer mechanism
  with ping-pong capability, prefetch logic, and request-driven data delivery.

  The module pre-fills its internal FIFO from DDR before enabling audio output, ensuring glitch-free
  playback startup. Multiple audio consumers can share a single FRDDR via the source selection
  mechanism, enabling efficient multi-output scenarios.

  FIFO depth is `{fifo_depth}×64` bits for enabled instance(s), providing sufficient buffering
  for interrupt latency and DMA burst granularity.

features: |
  - Configurable FIFO depth: `{fifo_depth}×64` bits per instance.
  - Ring buffer operation with start/finish address boundaries.
  - Ping-pong (double buffer) mode for seamless buffer switching.
  - Automatic FIFO prefetch on enable (fills before first request served).
  - Request-driven data delivery to multiple consumers (TDMOUT, SPDIFOUT, EQ/DRC, Mixer).
  - Configurable ACK delay for timing alignment.
  - Multiple interrupt sources: buffer empty, threshold, address match, FIFO overflow.
  - Interrupt watermark address for partial buffer notifications.
  - Force-finish command for graceful stop with address alignment.
  - Extended 34-bit addressing for >4GB memory systems (`AADDR` register).
  - Shared buffer support with channel number configuration.
  - Per-lane source selection for multi-consumer architectures.
  - Programmable endianness for byte ordering.
  - Mixer request width selection (2ch vs 8ch).

