title_template: "{CHIP} Audio Specification"

overview: |
  {CHIP} audio subsystem integrates:
  - {tdmin_count} TDM input interfaces (exclude TDMIN_LB), supports `TDM`, `SPDIF`, and `PDM`
  - {tdmout_count} TDM output interfaces, supports `TDM`, `SPDIF` encode, and `HDMI/DP TX`
  - {pdm_count} PDM interface(s)
  - {toddr_count} TODDR / {frddr_count} FRDDR for DDR datapath
  - {loopback_count} Loopback for AEC
  - EQDRC for audio EQ and DRC processing
  - eARC RX/TX for audio return channel

