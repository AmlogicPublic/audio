title_template: "{CHIP} Audio Specification"

overview: |
  Audio Path

  {CHIP} integrates:
  - {tdmin_count} TDM input interfaces (exclude TDMIN_LB)
  - {tdmout_count} TDM output interfaces
  - {pdm_count} PDM interface(s)
  - {toddr_count} TODDR (FIFO) for transfer input data to DDR
  - {frddr_count} FRDDR (FIFO) for transfer data from DDR to output
  - {loopback_count} Loopback for AEC

  Below is the diagram for {CHIP} audio path.

features:
  - Audio input supports `TDM`, `SPDIF`, and `PDM`.
  - Audio output supports `TDM`, `SPDIF` encode, and `HDMI/DP TX`.
  - DDR datapath uses `TODDR`/`FRDDR` FIFO transfer.
  - Loopback merges sources for AEC.
  - EQDRC provides EQ and DRC for audio streams.
  - eARC RX/TX for audio return channel.

