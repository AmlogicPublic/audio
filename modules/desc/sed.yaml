module: sed
display_name: "Sound Event Detector"
condition:
  any_of:
    - "sed.imp"

overview: |
  The Sound Event Detector (SED) is a dedicated neural network accelerator for audio classification,
  detecting specific sound events (doorbell, glass break, baby cry, etc.) in real-time. It combines
  front-end audio feature extraction (Mel filterbank) with a configurable neural network processor.

  The SED operates as an always-on, low-power coprocessor, enabling sound event detection without
  main CPU intervention until a positive detection triggers an interrupt.

features:
  - Complete audio feature extraction pipeline (downsampling, pre-emphasis, FFT, Mel filterbank).
  - Configurable neural network engine with command-chain execution.
  - Supports convolution, batch normalization, and multiple activation functions.
  - SRAM-based weight and activation storage.
  - Power-triggered processing for energy efficiency.
  - Interrupt on detection for CPU wake-up.
  - Programmable clock divider for power/performance tradeoff.

