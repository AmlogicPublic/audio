module: tdmin
display_name: "TDM Input Interface"
condition:
  any_of:
    - "tdmin.A.imp"
    - "tdmin.B.imp"
    - "tdmin.C.imp"
    - "tdmin.D.imp"
    - "tdmin.LB_A.imp"
    - "tdmin.LB_B.imp"

overview: |
  TDM Input (TDMIN) is a configurable serial audio receiver supporting both TDM (Time Division Multiplexing)
  and I2S interface modes. It deserializes audio data from external codecs, digital microphones, or
  internal loopback paths, and delivers PCM samples to the TODDR for DMA transfer to system memory.

  Each TDMIN instance supports up to `{pad_num}` parallel data lanes, enabling multi-channel audio capture
  (e.g., 8 lanes × 2 slots = 16 channels stereo, or 4 lanes × 8 slots = 32 channels TDM).

  The module includes an asynchronous FIFO (AFIFO) for clock domain crossing from the external bit clock
  (`tdm_sclk`) to the system clock (`sysclk`), ensuring glitch-free data transfer regardless of clock
  phase relationship.

features: |
  - Dual mode operation: TDM mode (up to 32 slots/frame) and I2S mode (2 slots/frame).
  - Supports up to `{pad_num}` parallel data lanes per instance (TDMIN_A/B: 4 lanes, TDMIN_C: 8 lanes).
  - Configurable bit width per slot: 8/16/24/32 bits (`reg_tdmin_bit_num`).
  - Flexible input source selection via `tdmin_src_sel`: external pads, HDMIRX, ACODEC, or internal TDMOUT loopback.
  - AFIFO for clock domain crossing (`tdm_sclk` → `sysclk`) with overflow detection.
  - Programmable bit skew adjustment (0-7 cycles) for LRCLK-to-data alignment (`reg_tdmin_in_bit_skew`).
  - Per-channel mask and mute control across all lanes (up to 32 channels/lane).
  - Full channel remapping via SWAP registers (any input slot → any output channel).
  - Optional WS (LRCLK) and DATA polarity inversion for codec compatibility.
  - LSB-first or MSB-first serial bit order.
  - Stability monitoring with configurable error masks (AFIFO overflow, slot/bit count errors).
  - Channel number (chnum) generation modes for multi-stream synchronization.

