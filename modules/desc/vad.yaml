module: vad
display_name: "Voice Activity Detector"
condition:
  any_of:
    - "audio_ao_top.Voice.vad.imp"
    - "audio_ee_top.Voice.vad.imp"

overview: |
  The Voice Activity Detector (VAD) is a low-power hardware module designed to wake up the DSP
  when it determines voice is present in a particular audio signal. It supports 2-channel audio
  streams combined from PDM filter output.

  The audio stream is downsampled to 8K/s rate and de-noised before detection processing. VAD
  performs detection every 10ms using three methods: power detection, cepstral detection, and
  spectral entropy detection. It contains a 256-point FFT for cepstral and spectral entropy
  calculation.

features:
  - Wake up DSP/CPU when voice activity detected.
  - Support 2 channels audio streams from PDM filter output.
  - Downsample to 8K/s sample rate with de-noise processing.
  - Three detection methods: power, cepstral, spectral entropy.
  - 10ms detection interval per frame.
  - 256-point radix-2 FFT for cepstral and spectral entropy calculation.
  - Pre-emphasis filter for speech enhancement.
  - Hanning window function for frame processing.
  - Dual-path decision: 2-combine-1 decision for even/odd channels.
  - N/M frame flag decision for final VAD output.
  - Independent clock gating per processing stage.
  - DDR write capability for buffered audio retrieval after wake-up.

block_diagram:
  images:
    - vad.png
  description: "VAD Processing Pipeline"

function_description: |
  **VAD Application Flow:**

  1. PDM and VAD enabled while CPU/DSP sleeps.
  2. Voice and VAD status continuously written to DDR via independent DMA.
  3. When VAD flag goes high, DSP wakes up.
  4. DSP reads saved addresses to locate voice start position.
  5. Software processes voice data with VAD status for each 10ms frame.

  **Processing Pipeline:**

  ```
  PDM_OUT(32bits)─┬─► vad_combine0 ─┬─► afifo8 ─► downsample_filter ─► in_data_ram ─► pow_detection
                  │                 │              + emphasis_filter    (spsram)        │
                  └─► vad_combine1 ─┘              exp_dat(18bits)                      ▼
                                                        │                         vadflag_pow
                                                        ▼
                                    ┌───────────────────────────────────────────────┐
                                    │  frame_256samples(18bits)                     │
                                    │       │                                       │
                                    │  hann_win_func ─► ram_256x32 ─► cepstrum ────►│─► ceps_flag
                                    │       │                           │           │
                                    │  radix-2 FFT ◄────────────────────┘           │
                                    │       │ (fft: pow_log 11bits)                 │
                                    │       │ (ifft: real_ceps 16bits)              │
                                    │       ▼                                       │
                                    │  pow_log ─► 11bits ─► spectral_entropy ──────►│─► se_flag
                                    └───────────────────────────────────────────────┘
                                                        │
                                    vadflag_pow ────────┼──► 2combin1 ──► 2combin1 ──► N/M frame ──► vadflag
                                    ceps_flag ──────────┤    decision      decision    flag decision
                                    se_flag ────────────┘
  ```

  **Three Detection Methods:**

  | Method | Description | Flag |
  |--------|-------------|------|
  | Power Detection | Energy-based detection from input samples | vadflag_pow |
  | Cepstral Detection | FFT → log → IFFT cepstrum features | ceps_flag |
  | Spectral Entropy | Log power spectrum entropy measure | se_flag |

  **Address Tracking:**

  When VAD triggers, hardware saves:
  - `addr_ddr_voice`: Current DDR write address for voice
  - `addr_ram_voice`: Current SRAM write pointer
  - `addr_ddr_vad`: Current DDR address for VAD status
  - `addr_ram_vad`: Current SRAM pointer for VAD status

  Software calculates:
  ```
  addr_cur_voice = addr_ddr_voice + addr_ram_voice
  addr_start_voice = addr_cur_voice - time_delay_s × fs
  addr_start_vad = addr_cur_vad - time_delay_s × 100
  ```

  Where `time_delay_s` accounts for VAD latency (<100ms) plus any required track-back.

  **1. Downsampling Filter + Emphasis:**

  Resamples input to 8 kHz for VAD processing with de-noise:
  - `dec_rate`: Decimation ratio configuration
  - `dec_filter_order`: FIR filter order (up to 26 coefficients)
  - `dec_coef_0` ~ `dec_coef_25`: 16-bit filter coefficients
  - Combined with emphasis filter for speech enhancement (y[n] = x[n] - α·x[n-1])
  - Output: exp_dat (18 bits)

  **2. Power Detection:**

  Direct energy-based detection from input data RAM:
  - Samples stored in spsram_360x18 (even/odd channels)
  - Outputs: vadflag_pow_e, vadflag_pow_o

  **3. 256-point Radix-2 FFT:**

  Core spectral analysis block:
  - Hanning window applied before FFT (hann_win_func → ram_256x32)
  - FFT loop: pow_log output (11 bits)
  - IFFT loop: real_ceps output (16 bits) for cepstrum

  **4. Cepstrum Detection:**

  FFT → log → IFFT based cepstrum feature extraction:
  - Outputs: ceps_flag

  **5. Spectral Entropy Detection:**

  Power spectrum entropy measurement:
  - pow_log → 11bits → spectral_entropy
  - Outputs: se_flag

  **6. Decision Logic:**

  Multi-stage decision combining:
  - 2combin1 decision: combines even/odd channel flags
  - N/M frame flag decision: final vadflag output based on M of N frames

  **7. Channel Configuration:**

  - `two_channel_en`: Enable dual-channel (even/odd) processing
  - `ch0_shift`, `ch1_shift`: Input scaling (0~3)
  - `VAD_IN_SEL0/1`: Audio source selection (combined from PDM filter)

  **Key Registers:**

  | Register | Function |
  |----------|----------|
  | `VAD_TOP_CTRL0` | Master enables: vad_en, dec_fir_en, pre_emp_en, ceps_*_en |
  | `VAD_TOP_CTRL1` | Clock gating and software resets per stage |
  | `VAD_TOP_CTRL2` | Channel shift configuration |
  | `VAD_FIR_CTRL` | Decimation rate, filter order, depth |
  | `VAD_FIR_EMP` | Pre-emphasis coefficient |
  | `VAD_FIR_COEF0-12` | Decimation filter coefficients |
  | `VAD_FRAME_CTRL0-2` | Frame buffer configuration |
  | `VAD_CEP_CTRL0-5` | Cepstrum analysis parameters |
  | `VAD_LUT_CTRL/WR/RD` | Lookup table access |
  | `VAD_TO_DDR` | DDR write control |
  | `VAD_SYNC_CTRL0` | Synchronization control |

  **Status Registers:**

  | Register | Content |
  |----------|---------|
  | `VAD_TOP_STS0-2` | Top-level status |
  | `VAD_FIR_STS0-1` | Decimation filter status |
  | `VAD_POW_STS0-2` | Power estimation status |
  | `VAD_FFT_STS0-1` | FFT computation status |
  | `VAD_SPE_STS0-3` | Spectrum entropy status |
  | `VAD_DEC_STS0-1` | Post-decimation status |

  **Clock Gating:**

  Per-stage clock gating in `VAD_TOP_CTRL1`:
  - `vad_clk_gate`, `prepare_clk_gate`, `proc_clk_gate`
  - `frame_his_clk_gate`, `ceps_ceps_clk_gate`, `ceps_spec_clk_gate`
  - Minimizes power when stages are idle

application_notes:
  - title: "Basic Voice Wake-up Configuration"
    steps:
      - Configure PDM input and combine channels via vad_combine0/1.
      - Set decimation filter to downsample to 8kHz.
      - Enable emphasis filter for speech enhancement.
      - Configure 256-point FFT for cepstrum and spectral entropy.
      - Set detection thresholds for power, cepstral, and spectral entropy.
      - Configure N/M frame decision (e.g., 3 of 5 frames).
      - Enable VAD and put DSP to sleep.
      - On VAD interrupt, read address registers.
      - Process buffered audio from calculated start address.

  - title: "Detection Method Selection"
    steps:
      - Power detection alone for simple energy-based wake-up.
      - Add cepstral detection for better speech vs noise discrimination.
      - Add spectral entropy for complex noise environments.
      - 2combin1 decision combines multiple detection results.
      - N/M frame decision provides temporal smoothing (reduces false alarms).

  - title: "Power Optimization"
    steps:
      - Enable clock gating for unused stages.
      - Use single-channel mode if stereo not needed.
      - Disable spectral entropy if cepstral detection sufficient.
      - 10ms frame interval balances latency vs power.

  - title: "Dual Microphone Configuration"
    steps:
      - Combine 2 PDM channels via vad_combine0/1.
      - Even/odd channel paths process independently.
      - Adjust `ch0_shift` and `ch1_shift` for gain matching.
      - 2combin1 decision merges even/odd channel flags.
      - Dual mics improve SNR and noise rejection.
