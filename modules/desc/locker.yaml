module: locker
display_name: "Audio Clock Locker"
condition:
  any_of:
    - "locker.A.imp"
    - "locker.B.imp"

overview: |
  The Audio Clock Locker is a precision clock measurement module that enables closed-loop PLL tracking
  of external asynchronous audio clocks. When the SoC cannot directly access an external clock source
  (e.g., remote Bluetooth speaker with independent crystal, HDMI source with unknown sample rate),
  the locker measures the frequency relationship and allows software to dynamically adjust the on-chip
  audio PLL to match the external rate.

  The primary use case is **PLL-based clock synchronization**: the locker continuously measures the
  ratio between the external audio clock and internal reference, software calculates the rate error,
  and adjusts the PLL divider/multiplier to minimize drift. This forms a software-controlled PLL
  tracking loop that can lock to arbitrary external sample rates.

  The module measures clock relationships between three domains: a stable reference clock (`refclk`),
  an input audio clock (`imclk`), and an output audio clock (`omclk`). With a 166MHz reference clock,
  the locker achieves approximately 54 counts per 48kHz BCLK period, providing PPM-level precision
  for rate mismatch detection and PLL tuning.

features: |
  - Enables software-controlled PLL tracking of external asynchronous audio clocks.
  - Three-domain clock measurement: reference (`refclk`), input (`imclk`), and output (`omclk`).
  - Selectable reference clock source: system clock (pclk, ~166MHz) or oscillator (24MHz).
  - High resolution: ~54 counts per 48kHz BCLK period with 166MHz reference (PPM-level precision).
  - Four independent cross-domain counters for bidirectional measurement.
  - Programmable latch intervals for flexible measurement windows.
  - Hardware-triggered (continuous) or software-triggered (on-demand) counter latching.
  - 64-bit counter values (low + high registers) for extended measurement windows.
  - Per-domain clock downsampling for high-frequency clock measurement.
  - Interrupt generation on measurement completion for closed-loop control.
  - Dual instances (A and B) for monitoring multiple clock pairs simultaneously.
  - Package counters for measurement cycle tracking.

