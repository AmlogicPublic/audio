module: resample
display_name: "Audio Resample (SRC)"
condition:
  any_of:
    - "resample.A.imp"
    - "resample.B.imp"
    - "resample.C.imp"

overview: |
  The Audio Resample module is an Asynchronous Sample Rate Converter (ASRC) that converts audio streams
  between different sample rates in real-time. It uses a polyphase interpolation architecture with
  adaptive rate tracking to handle arbitrary and time-varying rate ratios, enabling seamless
  interconnection of asynchronous audio domains.

  {CHIP} integrates {resample_count} resample instance(s), supporting up to `{chnum}` channels
  at `{dw}` bits per sample. The module features an internal phase-locked loop (PLL-like) mechanism
  that continuously tracks the input/output rate relationship, compensating for clock drift in
  live streaming scenarios.

features: |
  - Asynchronous sample rate conversion with arbitrary ratio support.
  - Data width up to `{dw}` bits per sample.
  - Multi-channel support: up to `{chnum}` channels per instance.
  - Polyphase sinc interpolator with programmable tap count (`intp_tap`).
  - Anti-alias FIR filter with programmable tap count (`filt_tap`).
  - Post-compensation IIR filter for passband ripple correction.
  - Adaptive rate tracking (PLL-like) for asynchronous clock domains.
  - Bypass mode for direct passthrough.
  - Programmable phase step (NCO) for precise ratio control.
  - PI loop filter with adjustable KP/KI gains.
  - Watchdog timer for hang detection.
  - Per-stage clock gating for power optimization.
  - Coefficient RAM for custom filter profiles.
  - Status registers for loop lock quality monitoring.

