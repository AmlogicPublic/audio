module: mixer
display_name: "Audio Mixer"
condition:
  any_of:
    - "mixer.A.imp"

overview: |
  The Audio Mixer module performs weighted summing of multiple audio channels with programmable
  gain coefficients and soft-clipping. It enables stereo mixing, channel combining, and volume
  control for output streams destined for TDMOUT, SPDIFOUT, or other downstream processing.

  This is primarily used for low latency applications,
  the upper layer software will use a low latency thread to feed timing-critical data to the mixer as the primary source,
  with normal data(higher latency) from the standard audio software stack(thread) as the secondary source.

  The mixer supports dual input paths (FRDDR A + FRDDR B, or FRDDR + EQ/DRC), allowing
  applications like music + notification mixing, voice ducking, or multi-source audio blending.
  Coefficient arithmetic matches the EQ/DRC module for consistent gain scaling.

features: |
  - 2-to-1 channel mixing with 4 programmable coefficients (2×2 matrix).
  - 32-bit signed fixed-point coefficients (24-bit effective precision).
  - Unity gain: `0x00800000` = 1.0, mute: `0x00000000`.
  - Soft-clip threshold to prevent overflow distortion.
  - Dual input path: Request A (FRDDR) + Request B (FRDDR or EQ/DRC).
  - Selectable data width: 8/16/32-bit samples.
  - Multi-lane support for multi-channel streams.
  - AFIFO for clock domain crossing.
  - Configurable FRDDR source selection for each request path.
  - Mixer delay compensation for EQ/DRC pipeline alignment.
  - SPDIF mode support for [27:4] data extraction.
  - Status monitoring: overflow flag, FRDDR init state.

