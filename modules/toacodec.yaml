module: TOACODEC
parent_base: audio_top_ee

instances:
  A:
    offset_base: 0x1d0
    condition: { macro_path: ["toacodec", "imp"], eq: 1 }

registers:
  - name: TOACODEC_CTRL0
    offset: 0x00
    fields:
      - bits: "31"
        name: reg_toacodec_en_dat
        access: R/W
        default: "0"
        description: "0:disable; 1:enable; step3"
      - bits: "30"
        name: reg_toacodec_en_bclk
        access: R/W
        default: "0"
        description: "0:disable; 1:enable; step2"
      - bits: "29"
        name: reg_toacodec_en_mclk
        access: R/W
        default: "0"
        description: "0:disable; 1:enable; step1"
      - bits: "27:22"
        name: dat1_sel
        access: R/W
        default: "0x00"
        description: "0~7:tdmout_a_dat[0~7]; 8~15:tdmout_b_dat[0~7]; 16~23:tdmout_c_dat[0~7]; 24~31:tdmout_d_dat[0~7]"
      - bits: "21:16"
        name: dat0_sel
        access: R/W
        default: "0x00"
        description: "0~7:tdmout_a_dat[0~7]; 8~15:tdmout_b_dat[0~7]; 16~23:tdmout_c_dat[0~7]; 24~31:tdmout_d_dat[0~7]"
      - bits: "15:12"
        name: lrclk_sel
        access: R/W
        default: "0x0"
        description: "0:tdmout_a_lrclk; 1:tdmout_b_lrclk; 2:tdmout_c_lrclk; 4~7:tdmin_a~d_lrclk; 8~13:mst_a~f_lrclk_ph0"
      - bits: "10"
        name: lrclk_inv
        access: R/W
        default: "0"
        description: "1:invert lrclk"
      - bits: "9"
        name: bclk_cap_inv
        access: R/W
        default: "0"
        description: "use invert bclk to capture dat_o and lrclk_o"
      - bits: "8"
        name: bclk_o_inv
        access: R/W
        default: "0"
        description: "final bclk connect to acodec will invert"
      - bits: "7:4"
        name: bclk_sel
        access: R/W
        default: "0x0"
        description: "0:tdmout_a_bclk; 1:tdmout_b_bclk; 2:tdmout_c_bclk; 4~7:tdmin_a~d_bclk; 8~13:mst_a~f_sclk"
      - bits: "3:0"
        name: mclk_sel
        access: R/W
        default: "0x0"
        description: "0~5:mst_mclk_a~f; 6:slv_sclk_a; 7:slv_sclk_b"
