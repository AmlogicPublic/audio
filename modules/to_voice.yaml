module: TO_{VOICE}
parent_base: audio_top_ee

# {VOICE} 占位符由 config.py 中的 voice.algo 决定 (sed/vad)

instances:
  A:
    offset_base: 0x1d2
    condition: { macro_path: ["voice", "imp"], eq: 1 }

registers:
  - name: TO{VOICE}_CTRL0
    offset: 0x00
    fields:
      - bits: "31"
        name: reg_tovad_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: reg_tovad_v_sel
        access: R/W
        default: "0"
        description: "0:level; 1:pulse"
      - bits: "16:12"
        name: src_sel
        access: R/W
        default: "0x00"
        description: "0:tdmin_a; 1:tdmin_b; 2:tdmin_c; 3:spdifin; 4:pdmin; 5:fratv; 6:tdmin_lb; 7:loopback_a; 8:frhdmirx_spdif; 9:loopback_b; 10:spdifin_lb; 11:earc_rx_dmac; 12:frhdmirx_dsd; 13:resample_a; 14:resample_b; 15:vad"
