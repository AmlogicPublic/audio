module: EQ_DRC

module_condition:
  macro_path:
    - eqdrc
    - imp
  eq: 1
  extra_conditions:
    - macro_path: [eqdrc, static]
      eq: 1
    - macro_path: [eqdrc, arch]
      eq: "reg"

registers:
  - name: AED_COEF_RAM_CNTL
    offset: 0x0000
    description: AED coefficient RAM control
    fields:
      - bits: "31:10"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "9:2"
        name: addr
        access: R/W
        default: "0"
        description: Read or write the addr of coef ram
      - bits: "1"
        name: rd_wr
        access: R/W
        default: "0"
        description: "0: read from coef ram; 1: write to coef ram"
      - bits: "0"
        name: valid
        access: R/W
        default: "0"
        description: "0: command finished; 1: command wait to be done"

  - name: AED_COEF_RAM_DATA
    offset: 0x0001
    description: AED coefficient RAM data
    fields:
      - bits: "31:26"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "25:0"
        name: data
        access: R/W
        default: "0"
        description: Read from coef ram or write to coef ram

  - name: AED_EQ_EN
    offset: 0x0002
    description: AED EQ enable
    fields:
      - bits: "31:2"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "1"
        name: eq2_en
        access: R/W
        default: "0"
        description: "Enable EQ for ch3 and ch4. 1: enable, 0: bypass"
      - bits: "0"
        name: eq1_en
        access: R/W
        default: "0"
        description: "Enable EQ for ch1 and ch2. 1: enable, 0: bypass"

  - name: AED_EQ_TAP_CNTL
    offset: 0x0003
    description: AED EQ tap control
    fields:
      - bits: "31:10"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "9:5"
        name: eq2_tap
        access: R/W
        default: "0xa"
        description: Set the tap for EQ2
      - bits: "4:0"
        name: eq1_tap
        access: R/W
        default: "0xa"
        description: Set the tap for EQ1

  - name: AED_EQ_VOLUME
    offset: 0x0004
    description: AED EQ volume
    fields:
      - bits: "31:30"
        name: volume_step
        access: R/W
        default: "0x2"
        description: Volume adjust step
      - bits: "29:26"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "25:16"
        name: volume_master
        access: R/W
        default: "0x3ff"
        description: Master volume
      - bits: "15:8"
        name: volume_ch2
        access: R/W
        default: "0x30"
        description: Channel 2 volume
      - bits: "7:0"
        name: volume_ch1
        access: R/W
        default: "0x30"
        description: Channel 1 volume

  - name: AED_EQ_VOLUME_SLEW_CNT
    offset: 0x0005
    description: AED EQ volume slew count
    fields:
      - bits: "31:12"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "11:0"
        name: volume_slew_cnt
        access: R/W
        default: "0"
        description: Control volume change and mute ramp rate

  - name: AED_MUTE
    offset: 0x0006
    description: AED mute control
    fields:
      - bits: "31"
        name: mute_master
        access: R/W
        default: "0"
        description: Mute all
      - bits: "30:2"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "1"
        name: mute_ch2
        access: R/W
        default: "0"
        description: Mute channel 2
      - bits: "0"
        name: mute_ch1
        access: R/W
        default: "0"
        description: Mute channel 1

  - name: AED_DRC_CNTL
    offset: 0x0007
    description: AED DRC control
    fields:
      - bits: "31:6"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "5:3"
        name: drc_tap
        access: R/W
        default: "0x5"
        description: Power tap for DRC
      - bits: "2"
        name: drc_pow_sel
        access: R/W
        default: "0"
        description: "Gain alpha filter input select. 0: dB domain, 1: decimal domain"
      - bits: "1"
        name: drc_rms_mode
        access: R/W
        default: "0"
        description: "Power calculation mode. 0: RMS, 1: peaking"
      - bits: "0"
        name: drc_en
        access: R/W
        default: "0"
        description: "Enable post DRC. 1: enable, 0: bypass"

