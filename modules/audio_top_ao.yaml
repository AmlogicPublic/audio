module: AUDIO_TOP_AO

# Voice相关寄存器参数化规则
# {VOICE} 会被替换为大写的算法名: SED 或 VAD
# {TO_VOICE} 会被替换为: TOSED 或 TOVAD
voice_params:
  placeholders:
    - VOICE # 直接用算法名: sed->SED, vad->VAD
    - TO_VOICE # 带TO前缀: sed->TOSED, vad->TOVAD

registers0:
  - name: EE_AUDIO2_CLK81_CTRL
    offset: 0x0000
    description: audio top clock-81 control register
    fields:
      - bits: "31"
        name: pclk_div_sel
        access: R
        default: "0"
        description: pclk_div_sel
      - bits: "24"
        name: clk_en_b
        access: R/W
        default: "0"
        description: clk_en_b
      - bits: "23:16"
        name: clk81_div_b
        access: R/W
        default: "0x00"
        description: clk81_div_b
      - bits: "15"
        name: clk_div_sel
        access: R/W
        default: "0"
        description: "0:pclk_div_a; 1:pclk_div_b"
      - bits: "8"
        name: clk_en_a
        access: R/W
        default: "1"
        description: clk_en_a
      - bits: "7:0"
        name: clk81_div_a
        access: R/W
        default: "0x00"
        description: clk81_div_a

  - name: EE_AUDIO2_CLK81_EN
    offset: 0x0001
    description: audio top clock-81 enable register
    fields:
      - bits: "31"
        name: clk_81_div_en
        access: R/W
        default: "1"
        description: clk_81_div_en

  - name: EE_AUDIO2_SW_RESET0
    offset: 0x0002
    description: software reset control register
    fields:
      - bits: "8"
        name: sed
        access: R/W
        default: "0"
        description: sed reset
      - bits: "7"
        name: irqfifocnt2
        access: R/W
        default: "0"
        description: Irqfifocnt2 reset
      - bits: "6"
        name: irqfifocnt1
        access: R/W
        default: "0"
        description: Irqfifocnt1 reset
      - bits: "5"
        name: clkrst
        access: R/W
        default: "0"
        description: clkrst reset
      - bits: "4"
        name: tovad
        access: R/W
        default: "0"
        description: tovad reset
      - bits: "3"
        name: toddrc
        access: R/W
        default: "0"
        description: toddrc reset
      - bits: "2"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "1"
        name: pdm
        access: R/W
        default: "0"
        description: pdm reset
      - bits: "0"
        name: ddr_arb
        access: R/W
        default: "0"
        description: ddr_arb reset

  - name: EE_AUDIO2_CLK_GATE_EN0
    offset: 0x0003
    description: clock gate enable register
    fields:
      - bits: "8"
        name: sed
        access: R/W
        default: "0"
        description: sed clock gate
      - bits: "7"
        name: irqfifocnt2
        access: R/W
        default: "0"
        description: Irqfifocnt2 clock gate
      - bits: "6"
        name: irqfifocnt1
        access: R/W
        default: "0"
        description: Irqfifocnt1 clock gate
      - bits: "5"
        name: clkrst
        access: R/W
        default: "0"
        description: clkrst clock gate
      - bits: "4"
        name: tosed
        access: R/W
        default: "0"
        description: tosed clock gate
      - bits: "3"
        name: toddrc
        access: R/W
        default: "0"
        description: toddrc clock gate
      - bits: "2"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "1"
        name: pdm
        access: R/W
        default: "0"
        description: pdm clock gate
      - bits: "0"
        name: ddr_arb
        access: R/W
        default: "0"
        description: ddr_arb clock gate

  - name: EE_AUDIO2_SECURITY_CTRL0
    offset: 0x0004
    description: security control register
    fields:
      - bits: "31:0"
        name: to_ddr_src_sel
        access: R/W
        default: "0x00000000"
        description: the reg_to_ddr_src_sel bit needs to match to_ddr_security bit to pass security test

  - name: EE_AUDIO2_SECURITY_CTRL1
    offset: 0x0005
    description: security control register
    fields:
      - bits: "20"
        name: to_ddr_security
        access: R/W
        default: "0"
        description: to_ddr_security

  - name: EE_AUDIO2_SECURITY_MUTE
    offset: 0x0006
    description: security mute control register

  # Voice相关寄存器（名称根据algo参数化）
  - name: EE_AUDIO2_MCLK_{VOICE}_CTRL
    offset: 0x0010
    description: master clock control register
    voice_param: true
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h; 8~11:i_slv_mclk_pad0~3"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "frequency of mclk = pll/(clk_div+1)"

  - name: EE_AUDIO2_{VOICE}_CLK_CTRL
    offset: 0x0011
    description: ee_audio2_voice_clk_ctrl register
    voice_param: true
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h; 8:mst_mclk_vad"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "set 7 if need div 8"

  - name: EE_AUDIO2_MST_DLY_CTRL0
    offset: 0x0012
    description: master interface delay control register
    fields:
      - bits: "7:4"
        name: mst_lrclk_a_ph1_dly_sel
        access: R/W
        default: "0x0"
        description: mst_lrclk_a_ph1_dly_sel
      - bits: "3:0"
        name: mst_sclk_a_ph1_dly_sel
        access: R/W
        default: "0x0"
        description: mst_sclk_a_ph1_dly_sel

  - name: EE_AUDIO2_MST_{VOICE}_SCLK_CTRL0
    offset: 0x0013
    description: master serial clock control register
    voice_param: true
    fields:
      - bits: "31"
        name: clk_in_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: clk_out_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "29:20"
        name: sclk_divN
        access: R/W
        default: "0x000"
        description: "frequency of sclk = mclk/(sclk_divN+1)"
      - bits: "19:10"
        name: lrclk_hi
        access: R/W
        default: "0x000"
        description: "duty cycle of LRCLK, less than lrclk_div"
      - bits: "9:0"
        name: lrclk_divN
        access: R/W
        default: "0x000"
        description: "frequency of lrclk = sclk/(lrclk_divN+1)"

  - name: EE_AUDIO2_MST_{VOICE}_SCLK_CTRL1
    offset: 0x0014
    description: master serial clock control register
    voice_param: true
    fields:
      - bits: "31:28"
        name: sclk_ph0_sel
        access: R/W
        default: "0x0"
        description: "select from sclk_delay_line(depth is 16)"
      - bits: "27:24"
        name: lrclk_ph0_sel
        access: R/W
        default: "0x0"
        description: "select from lrclk_delay_line(depth is 16)"
      - bits: "23:20"
        name: sclk_ph1_sel
        access: R/W
        default: "0x0"
        description: "select from sclk_delay_line(depth is 16)"
      - bits: "19:16"
        name: lrclk_ph1_sel
        access: R/W
        default: "0x0"
        description: "select from lrclk_delay_line(depth is 16)"
      - bits: "15:12"
        name: sclk_ph2_sel
        access: R/W
        default: "0x0"
        description: "select from sclk_delay_line(depth is 16)"
      - bits: "11:8"
        name: lrclk_ph2_sel
        access: R/W
        default: "0x0"
        description: "select from lrclk_delay_line(depth is 16)"
      - bits: "5:0"
        name: clk_inv
        access: R/W
        default: "0x00"
        description: "invert clk; [5]:lrclk_ph2; [4]:sclk_ph2; [3]:lrclk_ph1; [2]:sclk_ph1; [1]:lrclk_ph0; [0]:sclk_ph0"

  - name: EE_AUDIO2_CLK_TDMIN_{VOICE}_CTRL
    offset: 0x0015
    description: TDM input clock control register
    voice_param: true
    fields:
      - bits: "31"
        name: clk_in_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: clk_out_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "29"
        name: sclk_inv
        access: R/W
        default: "0"
        description: "0:not revert; 1:revert clock"
      - bits: "27:24"
        name: sclk_sel
        access: R/W
        default: "0x0"
        description: "0:mst_vad_sclk_ph1; 1~5:mst_b~f_sclk_ph1; 6~15:i_slv_sclk_a~j"
      - bits: "23:20"
        name: lrclk_sel
        access: R/W
        default: "0x0"
        description: "0:mst_vad_lrclk_ph1; 1~5:mst_b~f_lrclk_ph1; 6~15:i_slv_lrclk_a~j"

  - name: EE_AUDIO2_CLK_PDMIN_CTRL0
    offset: 0x0016
    description: PDM input clock control register
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h; 8:mst_vad_mclk; 9~13:mst_b~f_mclk"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "set 7 if need div 8"

  - name: EE_AUDIO2_CLK_PDMIN_CTRL1
    offset: 0x0017
    description: PDM input clock control register
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h; 8:mst_vad_mclk; 9~13:mst_b~f_mclk"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "set 7 if need div 8"

  - name: EE_AUDIO2_AUD_{VOICE}_PAD_CTRL0
    offset: 0x0018
    description: ee_audio2_aud_voice_pad_ctrl0 register
    voice_param: true
    fields:
      - bits: "27"
        name: mst_lrclk_vad_oen
        access: R/W
        default: "0"
        description: mst_lrclk_vad_oen
      - bits: "16"
        name: mst_sclk_vad_oen
        access: R/W
        default: "0"
        description: mst_sclk_vad_oen
      - bits: "15"
        name: clk_en
        access: R/W
        default: "0"
        description: clk_en
      - bits: "14"
        name: force_osc_clk
        access: R/W
        default: "0"
        description: force_osc_clk
      - bits: "12"
        name: mst_mclk_vad_oen
        access: R/W
        default: "0"
        description: mst_mclk_vad_oen
      - bits: "10:8"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: clk_sel
      - bits: "7:0"
        name: clk_div
        access: R/W
        default: "0x00"
        description: "clk_div (vad_mclk to pad)"

  - name: EE_AUDIO2_CLK_PDMIN_CTRL2
    offset: 0x0019
    description: PDM input clock control register

  - name: EE_AUDIO2_{TO_VOICE}_CTRL0
    offset: 0x0020
    description: to-voice path control register
    voice_param: true
    fields:
      - bits: "21:20"
        name: ch_shift
        access: R/W
        default: "0x0"
        description: ch_shift
      - bits: "17"
        name: sel_soft_rst
        access: R/W
        default: "0"
        description: sel_soft_rst
      - bits: "16"
        name: ch_sel_gate
        access: R/W
        default: "0"
        description: ch_sel_gate
      - bits: "12:8"
        name: tovad_src_sel
        access: R/W
        default: "0x00"
        description: "0:tdmin_a; 1:tdmin_b; 2:tdmin_c; 3:spdifin; 4:pdmin; 5:fratv; 6:tdmin_lb; 7:loopback_a; 8:frhdmirx_spdif; 9:loopback_b; 10:spdifin_lb; 11:earc_rx_dmac; 12:frhdmirx_dsd; 13:resample_a; 14:resample_b; 15:vad; 16:pdmin_b; 17:tdmin_lb_b; 18:tdmin_d; 19:tdmin_vad"
      - bits: "1"
        name: tosed_v_sel
        access: R/W
        default: "0"
        description: tosed_v_sel
      - bits: "0"
        name: to_sed_en
        access: R/W
        default: "0"
        description: to_sed_en

  - name: EE_AUDIO2_{TO_VOICE}_CTRL1
    offset: 0x0021
    description: to-voice path control register
    voice_param: true
    fields:
      - bits: "31"
        name: bypass_n
        access: R/W
        default: "0"
        description: "0:out=in; 1:sync data by chnum info"
      - bits: "30"
        name: sw_reset
        access: R/W
        default: "0"
        description: "1:reset chnum_sync module"
      - bits: "29"
        name: mode
        access: R/W
        default: "0"
        description: "0:work as BUFF_MODE; 1:work as DROP_MODE"
      - bits: "28"
        name: id_se
        access: R/W
        default: "0"
        description: "0:ID=input valid count; 1:ID=reg_id_***"
      - bits: "27"
        name: fix_stable
        access: R/W
        default: "0"
        description: "1:ignore stable info of input; 0:compensate dat by stable info"
      - bits: "26"
        name: debug_en0
        access: R/W
        default: "0"
        description: "for BUF_MODE only; 1:send chnum info from input; 0:generate new chnum info"
      - bits: "7:0"
        name: chnum_max
        access: R/W
        default: "0x00"
        description: "if input is 8ch, set this to 7"

  - name: EE_AUDIO2_{TO_VOICE}_CH_EN
    offset: 0x0022
    description: ee_audio2_to_voice_ch_en register
    voice_param: true
    fields:
      - bits: "31:0"
        name: ch_en
        access: R/W
        default: "0x00000000"
        description: "channel enable, 1bit enable 1 channel"

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID0
    offset: 0x0023
    description: ee_audio2_to_voice_chnum_id0 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch3
        access: R/W
        default: "0x00"
        description: ID of ch3
      - bits: "23:16"
        name: id_ch2
        access: R/W
        default: "0x00"
        description: ID of ch2
      - bits: "15:8"
        name: id_ch1
        access: R/W
        default: "0x00"
        description: ID of ch1
      - bits: "7:0"
        name: id_ch0
        access: R/W
        default: "0x00"
        description: ID of ch0

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID1
    offset: 0x0024
    description: ee_audio2_to_voice_chnum_id1 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch7
        access: R/W
        default: "0x00"
        description: ID of ch7
      - bits: "23:16"
        name: id_ch6
        access: R/W
        default: "0x00"
        description: ID of ch6
      - bits: "15:8"
        name: id_ch5
        access: R/W
        default: "0x00"
        description: ID of ch5
      - bits: "7:0"
        name: id_ch4
        access: R/W
        default: "0x00"
        description: ID of ch4

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID2
    offset: 0x0025
    description: ee_audio2_to_voice_chnum_id2 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch11
        access: R/W
        default: "0x00"
        description: ID of ch11
      - bits: "23:16"
        name: id_ch10
        access: R/W
        default: "0x00"
        description: ID of ch10
      - bits: "15:8"
        name: id_ch9
        access: R/W
        default: "0x00"
        description: ID of ch9
      - bits: "7:0"
        name: id_ch8
        access: R/W
        default: "0x00"
        description: ID of ch8

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID3
    offset: 0x0026
    description: ee_audio2_to_voice_chnum_id3 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch15
        access: R/W
        default: "0x00"
        description: ID of ch15
      - bits: "23:16"
        name: id_ch14
        access: R/W
        default: "0x00"
        description: ID of ch14
      - bits: "15:8"
        name: id_ch13
        access: R/W
        default: "0x00"
        description: ID of ch13
      - bits: "7:0"
        name: id_ch12
        access: R/W
        default: "0x00"
        description: ID of ch12

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID4
    offset: 0x0027
    description: ee_audio2_to_voice_chnum_id4 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch19
        access: R/W
        default: "0x00"
        description: ID of ch19
      - bits: "23:16"
        name: id_ch18
        access: R/W
        default: "0x00"
        description: ID of ch18
      - bits: "15:8"
        name: id_ch17
        access: R/W
        default: "0x00"
        description: ID of ch17
      - bits: "7:0"
        name: id_ch16
        access: R/W
        default: "0x00"
        description: ID of ch16

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID5
    offset: 0x0028
    description: ee_audio2_to_voice_chnum_id5 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch23
        access: R/W
        default: "0x00"
        description: ID of ch23
      - bits: "23:16"
        name: id_ch22
        access: R/W
        default: "0x00"
        description: ID of ch22
      - bits: "15:8"
        name: id_ch21
        access: R/W
        default: "0x00"
        description: ID of ch21
      - bits: "7:0"
        name: id_ch20
        access: R/W
        default: "0x00"
        description: ID of ch20

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID6
    offset: 0x0029
    description: ee_audio2_to_voice_chnum_id6 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch27
        access: R/W
        default: "0x00"
        description: ID of ch27
      - bits: "23:16"
        name: id_ch26
        access: R/W
        default: "0x00"
        description: ID of ch26
      - bits: "15:8"
        name: id_ch25
        access: R/W
        default: "0x00"
        description: ID of ch25
      - bits: "7:0"
        name: id_ch24
        access: R/W
        default: "0x00"
        description: ID of ch24

  - name: EE_AUDIO2_{TO_VOICE}_CHNUM_ID7
    offset: 0x002a
    description: ee_audio2_to_voice_chnum_id7 register
    voice_param: true
    fields:
      - bits: "31:24"
        name: id_ch31
        access: R/W
        default: "0x00"
        description: ID of ch31
      - bits: "23:16"
        name: id_ch30
        access: R/W
        default: "0x00"
        description: ID of ch30
      - bits: "15:8"
        name: id_ch29
        access: R/W
        default: "0x00"
        description: ID of ch29
      - bits: "7:0"
        name: id_ch28
        access: R/W
        default: "0x00"
        description: ID of ch28

  - name: EE_AUDIO2_TODDR_{VOICE}_CTRL0
    offset: 0x0030
    description: TODDR control register
    voice_param: true
    fields:
      - bits: "31"
        name: reg_toddr_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "29"
        name: reg_ext_signed
        access: R/W
        default: "0"
        description: "0:write to one buff; 1:write to two buff"
      - bits: "28"
        name: reg_toddr_endian
        access: R/W
        default: "0"
        description: reg_toddr_endian
      - bits: "27"
        name: enable_sync_chnum
        access: R/W
        default: "0"
        description: "1:start store data when first ch"
      - bits: "26:24"
        name: reg_toddr_int_en
        access: R/W
        default: "0x0"
        description: reg_toddr_int_en
      - bits: "23:16"
        name: int_mask
        access: R/W
        default: "0x00"
        description: "[21]:fifo overflow write; [20]:fifo overflow read; [19]:int_addr once; [18]:int_addr repeat; [17]:match int_addr; [16]:match finish_addr"
      - bits: "15:13"
        name: reg_toddr_sel
        access: R/W
        default: "0x0"
