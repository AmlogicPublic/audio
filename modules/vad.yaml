        access: R/W
        default: "0"
        description: Pre RAM enable
      - bits: "27"
        name: frame_his_en
        access: R/W
        default: "0"
        description: Frame history enable
      - bits: "26"
        name: frame_his_save_en
        access: R/W
        default: "0"
        description: Frame history save enable
      - bits: "25:24"
        name: reserved1
        access: R/W
        default: "0"
