        access: R/W
        default: "0"
        description: reserved
      - bits: "5:3"
        name: drc_tap
        access: R/W
        default: "0x5"
        description: Power tap for DRC
      - bits: "2"
        name: drc_pow_sel
        access: R/W
        default: "0"
        description: "Gain alpha filter input select. 0: dB domain, 1: decimal domain"
      - bits: "1"
        name: drc_rms_mode
        access: R/W
        default: "0"
        description: "Power calculation mode. 0: RMS, 1: peaking"
      - bits: "0"
