module: RESAMPLE

instances:
  A:
    rename_rules:
      - pattern: "^RESAMPLE_"
        replacement: "AUDIO_RSAMP_"
  B:
    rename_rules:
      - pattern: "^RESAMPLE_"
        replacement: "AUDIO_RSAMPB_"
  C:
    rename_rules:
      - pattern: "^RESAMPLE_"
        replacement: "AUDIO_RSAMPC_"

registers0:
  - name: RESAMPLE_CTRL0
    offset: 0x0
    description: Resample reset control
    fields:
      - bits: "31:3"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "2"
        name: lock_rst
        access: R/W
        default: "0"
        description: Phase_lock module software reset
      - bits: "1"
        name: rsamp_rst
        access: R/W
        default: "0"
        description: Resample_core module software reset
      - bits: "0"
        name: sw_rst
        access: R/W
        default: "0"
        description: Resample_top module software reset

  - name: RESAMPLE_CTRL1
    offset: 0x1
    description: Resample main control
    fields:
      - bits: "31:26"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "25"
        name: rsamp_rst_sel
        access: R/W
        default: "0"
        description: "1: HW-driven reset for rsamp core; 0: use SW reg_rsamp_rst"
      - bits: "24"
        name: module_bypass
        access: R/W
        default: "0"
        description: "1: datapath bypass (input passes through unconverted); 0: normal SRC"
      - bits: "23:18"
        name: gclk_ctrl
        access: R/W
        default: "0"
        description: Per-subclock gate bitmap (save dynamic power when stages are idle)
      - bits: "17:13"
        name: in_msb
        access: R/W
        default: "0x17"
        description: Input sample MSB index in 32-bit word (defines justification for
          fixed-point audio)
      - bits: "12"
        name: output_en
        access: R/W
        default: "0"
        description: Output path gate for muxed source; must align with upstream mux
          when multiple SRC feeds exist
      - bits: "11"
        name: rsamp_en
        access: R/W
        default: "0"
        description: "Master SRC enable; 0 holds pipeline, 1 runs conversion"
      - bits: "10"
        name: filt_en
        access: R/W
        default: "0"
        description: "Anti-alias (AA) FIR before rate change; disable only for bypass/debug"
      - bits: "9"
        name: post_en
        access: R/W
        default: "0"
        description: "Post-compensation IIR after interpolator; shapes image/ripple
          after SRC"
      - bits: "8"
        name: inp_mux_mode
        access: R/W
        default: "0"
        description: Qualifies how inp_mux is interpreted (e.g. static vs sequenced
          input selection)
      - bits: "7:4"
        name: reserved2
        access: R/W
        default: "0"
        description: reserved
      - bits: "3:0"
        name: inp_mux
        access: R/W
        default: "0"
        description: Input source select for TODDR / direct-path mux into this SRC instance

  - name: RESAMPLE_CTRL2
    offset: 0x2
    description: Channel and filter tap control
    fields:
      - bits: "31:30"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "29:24"
        name: chx_size
        access: R/W
        default: "0x02"
        description: Active channel count minus one (multi-channel TDM into SRC)
      - bits: "23:18"
        name: reserved2
        access: R/W
        default: "0"
        description: reserved
      - bits: "17:16"
        name: scl_step
        access: R/W
        default: "0"
        description: "Internal scaler decimation: 0=1/1, 1=1/2, 2=1/4 to ease AA load"
      - bits: "15:8"
        name: filt_tap
        access: R/W
        default: "0x3f"
        description: AA FIR length (taps) — trades stopband vs cost/latency
      - bits: "7:0"
        name: intp_tap
        access: R/W
        default: "0x3f"
        description: Polyphase interpolator length (taps) — sets reconstruction quality

  - name: RESAMPLE_PHSINIT
    offset: 0x3
    description: Phase init control
    fields:
      - bits: "31:28"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "27:0"
        name: init_phs
        access: R/W
        default: "0"
        description: Initial fractional phase in NCO accumulator (fine-tunes start
          alignment with input stream)

  - name: RESAMPLE_PHSSTEP
    offset: 0x4
    description: Phase step control
    fields:
      - bits: "31"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "30:0"
        name: rsamp_step
        access: R/W
        default: "0x8000000"
        description: "NCO step per input sample: (Fs_in / down_ratio / Fs_out) × 2^28;
          drives output rate"

  - name: RESAMPLE_SHIFT
    offset: 0x5
    description: Filter shift control
    fields:
      - bits: "31:24"
        name: rsft_iir
        access: R/W
        default: "0x17"
        description: Right-shift after post compensation IIR (normalize IIR sum)
      - bits: "23:16"
        name: rsft_blnd
        access: R/W
        default: "0x15"
        description: Right-shift in blend/mix stage between AA and interpolator paths
      - bits: "15:8"
        name: rsft_sinc
        access: R/W
        default: "0x1f"
        description: Right-shift after polyphase sinc/interpolator (matches coef scaling)
      - bits: "7:0"
        name: rsft_aa
        access: R/W
        default: "0x1f"
        description: Right-shift after AA FIR (sum of taps can exceed 24-bit)

  - name: RESAMPLE_ADJ_CTRL0
    offset: 0x6
    description: Auto adjust control 0
    fields:
      - bits: "31:3"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "2"
        name: adj_out_inv
        access: R/W
        default: "0"
        description: Invert loop correction polarity if upstream clock relationship is
          reversed
      - bits: "1"
        name: adj_force_en
        access: R/W
        default: "0"
        description: "Inject adj_force_err / adj_ki_force for bench test; 0 uses live
          phase error"
      - bits: "0"
        name: adj_en
        access: R/W
        default: "0"
        description: "Enable adaptive step tuning; disable for fixed-ratio open-loop SRC"

  - name: RESAMPLE_ADJ_CTRL1
    offset: 0x7
    description: Auto adjust control 1
    fields:
      - bits: "31:16"
        name: adj_odet_step
        access: R/W
        default: "0x0008"
        description: Output-side phase detector granularity (coarse vs fine lock)
      - bits: "15:0"
        name: adj_kmax
        access: R/W
        default: "0x8000"
        description: Clamp on integrated correction (anti-windup / max pull-in)

  - name: RESAMPLE_ADJ_SFT
    offset: 0x8
    description: Auto adjust gain/shift control
    fields:
      - bits: "31:30"
        name: reserved
        access: R/W
        default: "0"
        description: reserved
      - bits: "29"
        name: adj_dif_sel
        access: R/W
        default: "0"
        description: Which internal tap feeds the phase-error difference (alternate
          observation points)
      - bits: "28:24"
        name: adj_ki
        access: R/W
        default: "0x09"
        description: Loop filter KI value
      - bits: "23:21"
        name: reserved2
        access: R/W
        default: "0"
        description: reserved
      - bits: "20:16"
        name: adj_kp
        access: R/W
        default: "0x01"
        description: Loop filter KP value
      - bits: "15:13"
        name: reserved3
        access: R/W
        default: "0"
        description: reserved
      - bits: "12:8"
        name: adj_ki_sft
        access: R/W
        default: "0x06"
        description: Shift value after KI multiplier
      - bits: "7:6"
        name: reserved4
        access: R/W
        default: "0"
        description: reserved
      - bits: "5:0"
        name: adj_out_sft
        access: R/W
        default: "0x0c"
        description: Adjustment output shift value

  - name: RESAMPLE_ADJ_IDET_LEN
    offset: 0x9
    description: Input detect window length
    fields:
      - bits: "31:0"
        name: adj_idet_len
        access: R/W
        default: "0x00002710"
        description: Samples averaged before updating input phase metric (noise vs response)

  - name: RESAMPLE_ADJ_FORCE
    offset: 0xa
    description: Forced phase error value
    fields:
      - bits: "31:0"
        name: adj_force_err
        access: R/W
        default: "0x00000008"
        description: Synthetic error word driven into loop when adj_force_en=1

  - name: RESAMPLE_ADJ_KI_FORCE
    offset: 0xb
    description: Forced KI value
    fields:
      - bits: "31:0"
        name: adj_ki_force
        access: R/W
        default: "0"
        description: Overrides I-branch accumulator when forcing is enabled

  - name: RESAMPLE_WATCHDOG_THRD
    offset: 0xc
    description: Watchdog threshold
    fields:
      - bits: "31:0"
        name: watchdog_thrd
        access: R/W
        default: "0"
        description: Cycle count without expected progress before watchdog event

  - name: RESAMPLE_DBG_INFO
    offset: 0xd
    description: Debug info control
    fields:
      - bits: "31:0"
        name: dbg_info
        access: R/W
        default: "0"
        description: Vendor-defined snapshot bus (see RTL tap list)

  - name: RESAMPLE_AOUT_FORCE
    offset: 0xe
    description: Forced output sample value
    fields:
      - bits: "31:0"
        name: aout_force
        access: R/W
        default: "0"
        description: Constant driven to output when force mode engaged in debug

  - name: RESAMPLE_IRQ_CTRL
    offset: 0xf
    description: Interrupt control
    fields:
      - bits: "31:0"
        name: irq_ctrl
        access: R/W
        default: "0"
        description: Bit-per-event enables and polarity (exact map in IRQ RTL)

  - name: RESAMPLE_RO_STATUS
    offset: 0x10
    description: Status readback
    fields:
      - bits: "31:0"
        name: ro_status
        access: R
        default: "0"
        description: "Packed: channel check err, idle, rsamp_fifo_over_cnt[7:0]"

  - name: RESAMPLE_RO_ADJ_FREQ
    offset: 0x11
    description: Adjusted frequency readback
    fields:
      - bits: "31:0"
        name: ro_adj_freq
        access: R
        default: "0"
        description: Effective NCO correction term (observe lock vs free-run)

  - name: RESAMPLE_RO_ADJ_DIFF_BAK
    offset: 0x12
    description: Previous phase difference readback
    fields:
      - bits: "31:0"
        name: ro_adj_diff_bak
        access: R
        default: "0"
        description: Held error sample used in dual-edge or debounce logic

  - name: RESAMPLE_RO_ADJ_DIFF_DLT
    offset: 0x13
    description: Phase difference delta readback
    fields:
      - bits: "31:0"
        name: ro_adj_diff_dlt
        access: R
        default: "0"
        description: First-difference of error; near zero when loop is steady

  - name: RESAMPLE_RO_ADJ_PHS_ERR
    offset: 0x14
    description: Phase error readback
    fields:
      - bits: "31:0"
        name: ro_adj_phs_err
        access: R
        default: "0"
        description: Raw detector output before scaling (sign = early/late)

  - name: RESAMPLE_RO_ADJ_KI_OUT
    offset: 0x15
    description: KI output readback
    fields:
      - bits: "31:0"
        name: ro_adj_ki_out
        access: R
        default: "0"
        description: I-branch accumulator (tracks DC clock offset)

  - name: RESAMPLE_RO_IN_CNT
    offset: 0x16
    description: Input sample counter
    fields:
      - bits: "31:0"
        name: ro_in_cnt
        access: R
        default: "0"
        description: Use with ro_out_cnt to verify ratio and detect stalls

  - name: RESAMPLE_RO_OUT_CNT
    offset: 0x17
    description: Output sample counter
    fields:
      - bits: "31:0"
        name: ro_out_cnt
        access: R
        default: "0"
        description: Monotonic count; mismatch vs input indicates drop/repeat

  - name: RESAMPLE_RO_ADJ_PHS_ERR_VAR
    offset: 0x18
    description: Phase error variance readback
    fields:
      - bits: "31:0"
        name: ro_adj_phs_err_var
        access: R
        default: "0"
        description: Rolling variance estimate for monitoring PLL jitter

  - name: RESAMPLE_POST_COEF0
    offset: 0x20
    description: Post filter coefficient 0
    fields:
      - bits: "31:0"
        name: post_coef0
        access: R/W
        default: "0"
        description: IIR tap / biquad coef word 0 (layout per RTL)

  - name: RESAMPLE_POST_COEF1
    offset: 0x21
    description: Post filter coefficient 1
    fields:
      - bits: "31:0"
        name: post_coef1
        access: R/W
        default: "0"
        description: IIR tap / biquad coef word 1 (layout per RTL)

  - name: RESAMPLE_POST_COEF2
    offset: 0x22
    description: Post filter coefficient 2
    fields:
      - bits: "31:0"
        name: post_coef2
        access: R/W
        default: "0"
        description: IIR tap / biquad coef word 2

  - name: RESAMPLE_POST_COEF3
    offset: 0x23
    description: Post filter coefficient 3
    fields:
      - bits: "31:0"
        name: post_coef3
        access: R/W
        default: "0"
        description: IIR tap / biquad coef word 3

  - name: RESAMPLE_POST_COEF4
    offset: 0x24
    description: Post filter coefficient 4
    fields:
      - bits: "31:0"
        name: post_coef4
        access: R/W
        default: "0"
        description: IIR tap / biquad coef word 4

  - name: RESAMPLE_AA_COEF_ADDR
    offset: 0x30
    description: AA coefficient address
    fields:
      - bits: "31:0"
        name: aa_coef_addr
        access: R/W
        default: "0"
        description: Word index before writing aa_coef_data

  - name: RESAMPLE_AA_COEF_DATA
    offset: 0x31
    description: AA coefficient data
    fields:
      - bits: "31:0"
        name: aa_coef_data
        access: R/W
        default: "0"
        description: Fixed-point tap at aa_coef_addr (symmetric half often implied)

  - name: RESAMPLE_SINC_COEF_ADDR
    offset: 0x40
    description: SINC coefficient address
    fields:
      - bits: "31:0"
        name: sinc_coef_addr
        access: R/W
        default: "0"
        description: Subfilter / phase bank index

  - name: RESAMPLE_SINC_COEF_DATA
    offset: 0x41
    description: SINC coefficient data
    fields:
      - bits: "31:0"
        name: sinc_coef_data
        access: R/W
        default: "0"
        description: Interpolator coefficient word at sinc_coef_addr
