        description: ID of ch30
      - bits: "15:8"
        name: ch29_id
        access: R/W
        default: "0x00"
        description: ID of ch29
      - bits: "7:0"
        name: ch28_id
        access: R/W
        default: "0x00"
        description: ID of ch28

  - name: RSAMP_{X}_CHSYNC_CTRL
    offset: 0xf
    description: resample channel sync control register
    fields:
      - bits: "31"
        name: bypass_n
        access: R/W
        default: "0"
        description: "0:out=in; 1:sync data by chnum info"
      - bits: "30"
        name: sw_reset
        access: R/W
        default: "0"
        description: "1:reset chnum_sync module"
      - bits: "29"
        name: mode
        access: R/W
        default: "0"
        description: "0:BUFF_MODE; 1:DROP_MODE"
      - bits: "28"
        name: id_sel
        access: R/W
        default: "0"
        description: "0:ID=input valid count; 1:ID=reg_id_***"
      - bits: "27"
        name: fix_stable
        access: R/W
        default: "0"
        description: "1:ignore stable info of input; 0:compensate dat by stable info"
      - bits: "26"
        name: debug_en0
        access: R/W
        default: "0"
        description: "BUF_MODE only; 1:send chnum info from input; 0:generate new chnum
          info"
      - bits: "7:0"
        name: chnum_max
        access: R/W
        default: "0x00"
        description: "if input is 8ch, set to 7"

chsync_mask:
  name: RSAMP_CHSYNC_MASK
  offset: 0xe
  base_instance: A
  fields:
    - bits: "23:16"
      name: rsamp_c_stable_mask
      access: R/W
      default: "0x00"
      description: "resample_C stable mask; [3]:out_en changed; [2]:soft_reset;
        [1]:en_r changed; [0]:en changed"
    - bits: "15:8"
      name: rsamp_b_stable_mask
      access: R/W
      default: "0x00"
      description: "resample_B stable mask; [3]:rsamp_en=0; [2]:rsamp_rst=1;
        [1]:output_en=0; [0]:bypass changed"
    - bits: "7:0"
      name: rsamp_a_stable_mask
      access: R/W
      default: "0x00"
      description: "resample_A stable mask; [3]:rsamp_en=0; [2]:rsamp_rst=1;
        [1]:output_en=0; [0]:bypass changed"
