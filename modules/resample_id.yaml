    offset: 0x0
    description: resample channel ID register
    fields:
      - bits: "31:24"
        name: ch3_id
        access: R/W
        default: "0x00"
        description: ID of ch3
      - bits: "23:16"
        name: ch2_id
        access: R/W
        default: "0x00"
        description: ID of ch2
      - bits: "15:8"
        name: ch1_id
        access: R/W
        default: "0x00"
        description: ID of ch1
      - bits: "7:0"
        name: ch0_id
        access: R/W
        default: "0x00"
        description: ID of ch0

