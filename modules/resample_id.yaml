module: RESAMPLE_ID
parent_base: audio_top_ee

instances:
  A:
    offset_base0: 0x350
    condition: { macro_path: [ "resample", "A", "imp" ], eq: 1 }
  B:
    offset_base0: 0x360
    condition: { macro_path: [ "resample", "B", "imp" ], eq: 1 }

