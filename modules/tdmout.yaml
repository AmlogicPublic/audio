module: TDMOUT
parent_base: audio_top_ee

instances:
  A:
    offset_base0: 0x400
    condition: { macro_path: ["tdmout", "A", "imp"], eq: 1 }
  B:
    offset_base0: 0x460
    condition: { macro_path: ["tdmout", "B", "imp"], eq: 1 }
  C:
    offset_base0: 0x4c0
    condition: { macro_path: ["tdmout", "C", "imp"], eq: 1 }

registers0:
  - name: TDMOUT_{X}_CTRL0
    offset: 0x00
    description: TDM output control register
    fields:
      - bits: "31"
        name: reg_work_enable
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: reg_rst_req_frddr
        access: R/W
        default: "0"
        description: "reset ref_frddr in TDMOUT"
      - bits: "29"
        name: reg_rst_afifo_out_n
        access: R/W
        default: "0"
        description: "reset afifo out side"
      - bits: "28"
        name: reg_rst_afifo_in_n
        access: R/W
        default: "0"
        description: "reset afifo in side; need set 1 after set reg_rst_afifo_out_n to 1"
      - bits: "19:15"
        name: reg_tdm_init_bitnum
        access: R/W
        default: "0x00"
        description: "initial count value of bitcnt"
      - bits: "14:10"
        name: reg_tdm_init_slotnum
        access: R/W
        default: "0x00"
        description: "initial count value of slotcnt"
      - bits: "9:5"
        name: reg_tdmout_slot_num
        access: R/W
        default: "0x00"
        description: "max value of slotcnt; if 8 slots, set to 7"
      - bits: "4:0"
        name: reg_tdmout_bit_num
        access: R/W
        default: "0x00"
        description: "max value of bitcnt; if 16bits, set to 15"

  - name: TDMOUT_{X}_CTRL1
    offset: 0x01
    description: TDM output control register
    fields:
      - bits: "31"
        name: eq_drc_sel
        access: R/W
        default: "0"
        description: "1:select eq_drc output"
      - bits: "30"
        name: reg_debug_en
        access: R/W
        default: "0"
        description: "0:disable debug; 1:enable"
      - bits: "29"
        name: reg_out_lsb_first
        access: R/W
        default: "0"
        description: "0:msb first; 1:lsb first"
      - bits: "28"
        name: reg_rev_ws_in
        access: R/W
        default: "0"
        description: "revert ws; 0:disable; 1:enable"
      - bits: "27"
        name: reg_rev_dat
        access: R/W
        default: "0"
        description: "revert data; 0:disable; 1:enable"
      - bits: "26:24"
        name: reg_frddr_sel
        access: R/W
        default: "0x0"
        description: "0:frddr_A; 1:frddr_B; 2:frddr_C; 3:frddr_D; 4:frddr_E"
      - bits: "23:16"
        name: reg_wait_cnt
        access: R/W
        default: "0x00"
        description: "wait some time when enable set to 1, then start request data from frddr"
      - bits: "15:14"
        name: reg_gain_shift
        access: R/W
        default: "0x0"
        description: "0:data*1; 1:data*2; 2:data*4; 3:data*8"
      - bits: "12:8"
        name: reg_frddr_msb
        access: R/W
        default: "0x00"
        description: "msb position of data"
      - bits: "6:4"
        name: reg_frddr_type
        access: R/W
        default: "0x0"
        description: "0:split 64bits to 8 sample(8bit); 1~2:16bit; 3~4:32bit"
      - bits: "3"
        name: reg_keep_req_ddr_init
        access: R/W
        default: "0"
        description: "set 0 will stop sending data if req_ddr stopped by init_done pull down"
      - bits: "2"
        name: reg_sts_sel
        access: R/W
        default: "0"
        description: reg_sts_sel
      - bits: "1"
        name: reg_mixer_sel
        access: R/W
        default: "0"
        description: "1:select mixer output"

  - name: TDMOUT_{X}_CTRL2
    offset: 0x02
    description: TDM output control register
    fields:
      - bits: "31:24"
        name: reg_clr_by_init
        access: R/W
        default: "0x00"
        description: "when FRDDR is disable, clear the status of REQ_FRDDR"
      - bits: "15:0"
        name: reg_tdm_lr_mix
        access: R/W
        default: "0x0000"
        description: "[15]:mix l15 and r15; ... [0]:mix l0 and r0"

  - name: TDMOUT_{X}_STAT
