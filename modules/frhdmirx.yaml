module: FRHDMIRX
parent_base: audio_top_ee

instances:
  A:
    offset_base0: 0x200
    condition: { macro_path: [ "hdmirx", "A", "imp" ], eq: 1 }
  B:
    offset_base0: 0x260
    condition: { macro_path: [ "hdmirx", "B", "imp" ], eq: 1 }

registers0:
  - name: FRHDMIRX_{X}_CTRL0
    offset: 0x0
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "31"
        name: reg_work_enable
        access: R/W
        default: "0"
        description: "for spdif, 0:disable; 1:enable"
      - bits: "30"
        name: reg_chnum_sel
        access: R/W
        default: "0"
        description: "0:ch_num=0~383(include frame cnt); 1:ch_num=0~1(only L/R)"
      - bits: "29"
        name: reg_rst_afifo_out_n
        access: R/W
        default: "0"
        description: "reset afifo out side"
      - bits: "28"
        name: reg_rst_afifo_in_n
        access: R/W
        default: "0"
        description: "reset afifo in side"
      - bits: "26"
        name: reg_chnum_en
        access: R/W
        default: "0"
        description: "1:start add ch_cnt to ch_num"
      - bits: "25"
        name: reg_findpapb_en
        access: R/W
        default: "0"
        description: "0:disable NonPCM mode; 1:enable"
      - bits: "24"
        name: reg_clk_inv
        access: R/W
        default: "0"
        description: "0:sample spdif by posedge; 1:sample spdif by negedge"
      - bits: "23:12"
        name: reg_nonpcm2pcm_th
        access: R/W
        default: "0x000"
        description: "when detected NonPcm mode, if long time didn't detect PaPb again,
          generate interrupt"
      - bits: "11:8"
        name: reg_ch_status_sel
        access: R/W
        default: "0x0"
        description: "for STAT1"
      - bits: "7"
        name: reg_mute_l
        access: R/W
        default: "0"
        description: "0:disable; 1:mute channel L"
      - bits: "6"
        name: reg_mute_r
        access: R/W
        default: "0"
        description: "0:disable; 1:mute channel R"
      - bits: "5:4"
        name: reg_spdifin_src_sel
        access: R/W
        default: "0x0"
        description: "0:PAD of spdifin; 1:spdifout"
      - bits: "3"
        name: reg_check_valid
        access: R/W
        default: "0"
        description: "0:disable valid check; 1:enable"
      - bits: "2"
        name: reg_check_parity
        access: R/W
        default: "0"
        description: "0:disable parity check; 1:enable"
      - bits: "1"
        name: reg_invert_data
        access: R/W
        default: "0"
        description: "0:disable; 1:invert [27:4] to [4:27]"
      - bits: "0"
        name: reg_spdifin_phase
        access: R/W
        default: "0"
        description: "0:disable invert; 1:enable"

  - name: FRHDMIRX_{X}_CTRL1
    offset: 0x1
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "31"
        name: enable_auto_mute
        access: R/W
        default: "0"
        description: "for spdif, 1:mute spdif dat by hdmirx_mute from HDMIRX"
      - bits: "27:20"
        name: reg_interrupt_mask
        access: R/W
        default: "0x00"
        description: "mask each interrupt"

  - name: FRHDMIRX_{X}_CTRL2
    offset: 0x2
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "31"
        name: dsd_work_enable
        access: R/W
        default: "0"
        description: "for dsd, 0:disable; 1:enable"
      - bits: "29"
        name: dsd_rst_afifo_out_n
        access: R/W
        default: "0"
        description: "reset afifo out side"
      - bits: "28"
        name: dsd_rst_afifo_in_n
        access: R/W
        default: "0"
        description: "reset afifo in side"
      - bits: "22"
        name: dsd_clk_inv
        access: R/W
        default: "0"
        description: "0:sample by posedge; 1:sample by negedge"
      - bits: "13:8"
        name: reg_init_cnt
        access: R/W
        default: "0x00"
        description: "how many bits stored in one sample, max 32, min 1; set 31 for 32bits"
      - bits: "7"
        name: ch7_out_en
        access: R/W
        default: "0"
        description: ch7_out_en
      - bits: "6"
        name: ch6_out_en
        access: R/W
        default: "0"
        description: ch6_out_en
      - bits: "5"
        name: ch5_out_en
        access: R/W
        default: "0"
        description: ch5_out_en
      - bits: "4"
        name: ch4_out_en
        access: R/W
        default: "0"
        description: ch4_out_en
      - bits: "3"
        name: ch3_out_en
        access: R/W
        default: "0"
        description: ch3_out_en
      - bits: "2"
        name: ch2_out_en
        access: R/W
        default: "0"
        description: ch2_out_en
      - bits: "1"
        name: ch1_out_en
        access: R/W
        default: "0"
        description: ch1_out_en
      - bits: "0"
        name: ch0_out_en
        access: R/W
        default: "0"
        description: ch0_out_en

  - name: FRHDMIRX_{X}_CTRL3
    offset: 0x3
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "30:28"
        name: ch7_sel
        access: R/W
        default: "0x0"
        description: "for dsd, 0:left lane0; 1:right lane0; 2:left lane1; 3:right lane1;
          ..."
      - bits: "26:24"
        name: ch6_sel
        access: R/W
        default: "0x0"
        description: ch6_sel
      - bits: "22:20"
        name: ch5_sel
        access: R/W
        default: "0x0"
        description: ch5_sel
      - bits: "18:16"
        name: ch4_sel
        access: R/W
        default: "0x0"
        description: ch4_sel
      - bits: "14:12"
        name: ch3_sel
        access: R/W
        default: "0x0"
        description: ch3_sel
      - bits: "10:8"
        name: ch2_sel
        access: R/W
        default: "0x0"
        description: ch2_sel
      - bits: "6:4"
        name: ch1_sel
        access: R/W
        default: "0x0"
        description: ch1_sel
      - bits: "2:0"
        name: ch0_sel
        access: R/W
        default: "0x0"
        description: ch0_sel

  - name: FRHDMIRX_{X}_CTRL4
    offset: 0x4
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "31:24"
        name: reg_clr_internal_sts
        access: R/W
        default: "0x00"
        description: "clear internal status"
      - bits: "23:16"
        name: reg_clr_interrupt
        access: R/W
        default: "0x00"
        description: "clear each bit of irq_status"
      - bits: "8"
        name: reg_papb_ext_sync
        access: R/W
        default: "0"
        description: "1:add ext 0 sync check for papb"
      - bits: "7:0"
        name: reg_papb_ext_mask
        access: R/W
        default: "0x00"
        description: "mask 8 channel 0 sync"

  - name: FRHDMIRX_{X}_CTRL5
    offset: 0x5
    description: HDMI-RX audio front-end control register
    fields:
      - bits: "27:20"
        name: stable_mask
        access: R/W
        default: "0x00"
        description: "condition of pull stable low"
      - bits: "19:16"
        name: stable_zcnt
        access: R/W
        default: "0x0"
        description: "condition to pull stable high"
      - bits: "15:8"
        name: stable_cyc_min
        access: R/W
        default: "0x00"
        description: stable_cyc_min
      - bits: "7:0"
        name: stable_cyc_max
        access: R/W
        default: "0x00"
        description: stable_cyc_max

  - name: FRHDMIRX_{X}_STAT0
    offset: 0x6
    description: HDMI-RX audio front-end status register
    fields:
      - bits: "31"
        name: valid_bit
        access: R
        default: "0"
        description: Valid bit
      - bits: "7:0"
        name: r_interrupt_status
        access: R
        default: "0x00"
        description: "interrupt status; [7]:find PaPb; [6]:valid changed; [5]:nonpcm to
          pcm; [4]:Pc/Pd changed; [3]:CH status changed; [2]:sample mode
          changed; [1]:parity error; [0]:overflow"

  - name: FRHDMIRX_{X}_STAT1
    offset: 0x7
    description: HDMI-RX audio front-end status register
    fields:
      - bits: "31:0"
        name: ch_status
        access: R
        default: "0x00000000"
        description: "channel status by reg_ch_status_sel"

  - name: FRHDMIRX_{X}_STAT2
    offset: 0x8
    description: HDMI-RX audio front-end status register
    fields:
      - bits: "31:0"
        name: debug_status
        access: R
        default: "0x00000000"
        description: "debug status"

  - name: FRHDMIRX_{X}_MUTE_VAL
    offset: 0x9
    description: HDMI-RX audio mute value register
    fields:
      - bits: "31:0"
        name: mute_val
        access: R/W
        default: "0x00000000"
        description: "when muted, the channel value"
