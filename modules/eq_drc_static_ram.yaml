module: EQ_DRC_STATIC_RAM

module_condition:
  macro_path:
    - eqdrc
    - static
  eq: 1

arch_condition:
  macro_path:
    - eqdrc
    - arch
  equals: ram

registers:
  # 1. AEQ_COEF_ADDR
  - name: AEQ_COEF_ADDR
    offset: 0x0
    description: Coefficient RAM address
    fields:
      - bits: "31:10"
        name: reserved
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "8:0"
        name: addr
        access: R/W
        default: "0x0"
        description: "read or write the addr of coef ram"

  # 2. AEQ_COEF_DATA
  - name: AEQ_COEF_DATA
    offset: 0x1
    description: Coefficient RAM data
    fields:
      - bits: "27:0"
        name: data
        access: R/W
        default: "0x0"
        description: "read from coef ram or write to coef ram"

  # 3. AEQ_MIX0_LL
  - name: AEQ_MIX0_LL
    offset: 0x2
    description: Mix coefficient LL
    fields:
      - bits: "27:0"
        name: mix_ll
        access: R/W
        default: "0x800000"
        description: Mix_ll

  # 4. AEQ_MIX0_RL
  - name: AEQ_MIX0_RL
    offset: 0x3
    description: Mix coefficient RL
    fields:
      - bits: "27:0"
        name: mix_rl
        access: R/W
        default: "0x0"
        description: Mix_rl

  # 5. AEQ_MIX0_LR
  - name: AEQ_MIX0_LR
    offset: 0x4
    description: Mix coefficient LR
    fields:
      - bits: "27:0"
        name: mix_lr
        access: R/W
        default: "0x0"
        description: Mix_lr

  # 6. AEQ_MIX0_RR
  - name: AEQ_MIX0_RR
    offset: 0x5
    description: Mix coefficient RR
    fields:
      - bits: "27:0"
        name: mix_rr
        access: R/W
        default: "0x800000"
        description: Mix_rr

  # 7. AEQ_SOFT_REST
  - name: AEQ_SOFT_REST
    offset: 0x9
    description: Soft reset control
    fields:
      - bits: "2"
        name: vol_rst
        access: R/W
        default: "0x0"
        description: Vol_rst
      - bits: "1"
        name: ctl_rst
        access: R/W
        default: "0x0"
        description: Ctl_rst
      - bits: "0"
        name: sw_rst
        access: R/W
        default: "0x0"
        description: Sw_rst

  # 8. AED_STATUS_CTRL
  - name: AED_STATUS_CTRL
    offset: 0x10
    description: AED status control register
    fields:
      - bits: "31:28"
        name: reserved_31_28
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "27"
        name: reg_bypass_en
        access: R/W
        default: "0x0"
        description: Reg_bypass_en
      - bits: "26"
        name: eqdrc_en
        access: R/W
        default: "0x1"
        description: eqdrc_en
      - bits: "25"
        name: vol_mst_en
        access: R/W
        default: "0x1"
        description: "Vol_mst_en //must set 1"
      - bits: "24"
        name: crx_bar_en
        access: R/W
        default: "0x0"
        description: "Crx_bar_en //must set 1"
      - bits: "23"
        name: fdrc_en
        access: R/W
        default: "0x0"
        description: Fdrc_en
      - bits: "22"
        name: vol_lr_en
        access: R/W
        default: "0x1"
        description: "Vol_lr_en //must set 1"
      - bits: "21"
        name: mixer_en
        access: R/W
        default: "0x0"
        description: "Mixer_en //must set 1"
      - bits: "20"
        name: fmt_en
        access: R/W
        default: "0x0"
        description: "Fmt_en //must set 1"
      - bits: "19:17"
        name: mdrc_en
        access: R/W
        default: "0x0"
        description: "Mdrc_en:bit[0]for low drc ,[1]for mid drc,[2]for high drc"
      - bits: "16:15"
        name: reserved_16_15
        access: R/W
        default: "0x1"
        description: reserved
      - bits: "14:13"
        name: input_bw
        access: R/W
        default: "0x1"
        description: "Input_bw : //unused"
      - bits: "12:8"
        name: eq_tap
        access: R/W
        default: "0xf"
        description: Eq_tap
      - bits: "7"
        name: mdrc_all_en
        access: R/W
        default: "0x0"
        description: Mdrc_all_en
      - bits: "6"
        name: lm_en
        access: R/W
        default: "0x0"
        description: Lm_en
      - bits: "5"
        name: reserved_5
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "4"
        name: reserved_4
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "3"
        name: "3d_en"
        access: R/W
        default: "0x0"
        description: 3d_en
      - bits: "2"
        name: eq_en
        access: R/W
        default: "0x0"
        description: Eq_en
      - bits: "1"
        name: peq_en
        access: R/W
        default: "0x0"
        description: Peq_en
      - bits: "0"
        name: dc_en
        access: R/W
        default: "0x0"
        description: Dc_en

  # 9. AED_SEL
  - name: AED_SEL
    offset: 0x11
    description: AED select register
    fields:
      - bits: "31"
        name: reserved_31
        access: R/W
        default: "0x0"
        description: ""
      - bits: "27:26"
        name: lm_mux
        access: R/W
        default: "0x0"
        description: "Lm_mux: 0/1: din, 2/3: peq, 4/5: dc, 6/7: mix, 8/9:eq, 10/11:eq, 12/13:3d surround, 14/15: mdrc1, 16/17: volume_lr, 18/19: full band drc, 20/21: volume master, 22/23: clip_out, 24:ch1_i2s_out, Default:ch2_i2s_out"
      - bits: "25"
        name: reserved_25
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "24:20"
        name: chx_num
        access: R/W
        default: "0x2"
        description: "Chx_num //unused"
      - bits: "15:12"
        name: reserved_15_12
        access: R/W
        default: "0x6"
        description: reserved
      - bits: "11:8"
        name: reserved_11_8
        access: R/W
        default: "0x4"
        description: reserved
      - bits: "4"
        name: ch2_i2s_mux
        access: R/W
        default: "0x0"
        description: "Ch2_i2s_mux: same as ch1"
      - bits: "0"
        name: ch1_i2s_mux
        access: R/W
        default: "0x0"
        description: "Ch1_i2s_mux:0:clip_out; 1:fmt_out; 2:dc_out; 3:mix_out; 4/5:eq_out; 6:3d_out; 7:mdrc1_out; 8:vol_lr_out; 9:fdrc_out; 10:volume_master_out; 11:peq_out"

  # 10. AED_EQ_VOLUME_VAL
  - name: AED_EQ_VOLUME_VAL
    offset: 0x12
    description: EQ volume value
    fields:
      - bits: "29:20"
        name: volume_master
        access: R/W
        default: "0xc4"
        description: Volume_master
      - bits: "19:10"
        name: volume_ch2
        access: R/W
        default: "0xc0"
        description: Volume_ch2
      - bits: "9:0"
        name: volume_ch1
        access: R/W
        default: "0xc0"
        description: Volume_ch1

  # 11. AED_EQ_VOLUME_STEP_CNT
  - name: AED_EQ_VOLUME_STEP_CNT
    offset: 0x13
    description: EQ volume step count
    fields:
      - bits: "31:30"
        name: volume_step
        access: R/W
        default: "0x2"
        description: Volume step
      - bits: "29:28"
        name: volume_master_step
        access: R/W
        default: "0x2"
        description: Volume master step
      - bits: "23:12"
        name: volume_slew_cnt
        access: R/W
        default: "0x1"
        description: Volume slew cnt
      - bits: "11:0"
        name: volume_master_slew_cnt
        access: R/W
        default: "0x1"
        description: Volume master slew cnt

  # 12. AED_MUTE_CTRL
  - name: AED_MUTE_CTRL
    offset: 0x14
    description: Mute control
    fields:
      - bits: "2"
        name: mute_master
        access: R/W
        default: "0x0"
        description: Mute_master
      - bits: "1"
        name: mute_ch2
        access: R/W
        default: "0x0"
        description: Mute_ch2
      - bits: "0"
        name: mute_ch1
        access: R/W
        default: "0x0"
        description: Mute_ch1

  # 13. AEQ_DSP_VOL_DBG_SEL
  - name: AEQ_DSP_VOL_DBG_SEL
    offset: 0x15
    description: DSP volume debug select
    fields:
      - bits: "4:0"
        name: ro_sel
        access: R/W
        default: "0x0"
        description: "Ro_sel: 0:ch1_volume_state; 1:ch1_volume_gain; 2:ch2_volume_state; 3:ch2_volume_gain; 4:master_volume_state; 5:master_volume_gain; 7:pow_current(low_drc); 8:pow_out(low_drc); 9:pow_adj(low_drc); 10:drc_gain_out(low_drc); 11:pow_current(mid_drc); 12:pow_out(mid_drc); 13:pow_adj(mid_drc); 14:drc_gain_out(mid_drc); 15:pow_current(high_drc); 16:pow_out(high_drc); 17:pow_adj(high_drc); 18:drc_gain_out(high_drc); 19:pow_current(full_drc); 20:pow_out(full_drc); 21:pow_adj(full_drc); 22:drc_gain_out(full_drc)"

  # 14. AED_CLIP_THD
  - name: AED_CLIP_THD
    offset: 0x17
    description: Clip threshold
    fields:
      - bits: "26:0"
        name: clip_thd
        access: R/W
        default: "0x7ffffff"
        description: Clip_thd

  # 15. AEQ_RO_DSP_DBG
  - name: AEQ_RO_DSP_DBG
    offset: 0x30
    description: DSP debug register (read-only)
    fields:
      - bits: "27:0"
        name: dsp_debug
        access: R
        default: ""
        description: Dsp debug register

  # 16. AEQ_RO_LM_RMS_OUT
  - name: AEQ_RO_LM_RMS_OUT
    offset: 0x31
    description: Level meter RMS output (read-only)
    fields:
      - bits: "27:0"
        name: lm_rms_out
        access: R
        default: ""
        description: Level meter out

  # 17. AEQ_RO_DSP_ERR
  - name: AEQ_RO_DSP_ERR
    offset: 0x32
    description: DSP error register (read-only)
    fields:
      - bits: "3:0"
        name: dsp_state
        access: R
        default: ""
        description: Dsp state

  # 18. EE_AED_AED_TOP_CTL0
  - name: EE_AED_AED_TOP_CTL0
    offset: 0x83
    description: AED top control 0
    fields:
      - bits: "31"
        name: reg_start_en
        access: R/W
        default: "0x0"
        description: "reg_start_en:write 1 to start eqdrc function,will auto clear to 0"
      - bits: "30"
        name: reg_sf_rst
        access: R/W
        default: "0x0"
        description: reg_sf_rst
      - bits: "29"
        name: reg_cfg_load
        access: R/W
        default: "0x0"
        description: reg_cfg_load
      - bits: "28:14"
        name: reserved_28_14
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "14"
        name: reg_mixer_sel
        access: R/W
        default: "0x0"
        description: "Reg_mixer_sel : input select mixer"
      - bits: "13:11"
        name: reg_data_type
        access: R/W
        default: "0x0"
        description: "reg_data_type:0: split 64bits ddr data to 8 sample, each sample need 8 bits; if bitwidth < 8, left-justified; 1: split 64bits ddr data to 4 sample, each sample need 16 bits; if bitwidth < 16, left-justified ; 2: split 64bits ddr data to 4 sample, each sample need 16 bits; if bitwidth < 16, right-justified ; 3: split 64bits ddr data to 2 sample, each sample need 32 bits; if bitwidth < 32, left-justified; 4: split 64bits ddr data to 2 sample, each sample need 32 bits; if bitwidth < 32, right-justified;"
      - bits: "10:6"
        name: reg_data_msb
        access: R/W
        default: "0x0"
        description: "reg_data_msb:msb position of data"
      - bits: "5:3"
        name: reg_frddr_source
        access: R/W
        default: "0x0"
        description: "reg_frddr_source: 0:frddr_A; 1:frddr_B; 2:frddr_C; 3:frddr_D; 4:frddr_E;"
      - bits: "2"
        name: reg_afifo_in_rst
        access: R/W
        default: "0x0"
        description: "reg_afifo_in_rst: reset afifo in side;"
      - bits: "1"
        name: reg_afifo_out_rst
        access: R/W
        default: "0x0"
        description: "reg_afifo_out_rst:reset afifo out side;"
      - bits: "0"
        name: req_eqdrc_en
        access: R/W
        default: "0x0"
        description: "req_eqdrc_en:eqdrc module enable"

  # 19. EE_AED_AED_TOP_CTL1
  - name: EE_AED_AED_TOP_CTL1
    offset: 0x84
    description: AED top control 1
    fields:
      - bits: "31:28"
        name: reg_ch4_sel
        access: R/W
        default: "0x0"
        description: "reg_ch4_sel:channel 4 data source select"
      - bits: "27:24"
        name: reg_ch3_sel
        access: R/W
        default: "0x0"
        description: "reg_ch3_sel:channel 3 data source select"
      - bits: "23:20"
        name: reg_ch2_sel
        access: R/W
        default: "0x0"
        description: "reg_ch2_sel:channel 2 data source select"
      - bits: "19:16"
        name: reg_ch1_sel
        access: R/W
        default: "0x0"
        description: "reg_ch1_sel:channel 1 data source select"
      - bits: "7"
        name: reg_eq_ch4_en
        access: R/W
        default: "0x0"
        description: "reg_eq_ch4_en :channel 4 eq enable"
      - bits: "6"
        name: reg_eq_ch3_en
        access: R/W
        default: "0x0"
        description: "reg_eq_ch3_en :channel 3 eq enable"
      - bits: "5"
        name: reg_eq_ch2_en
        access: R/W
        default: "0x0"
        description: "reg_eq_ch2_en :channel 2 eq enable"
      - bits: "4"
        name: reg_eq_ch1_en
        access: R/W
        default: "0x0"
        description: "reg_eq_ch1_en :channel 1 eq enable"
      - bits: "3:0"
        name: reg_channel_valid
        access: R/W
        default: "0x0"
        description: "reg_channel_valid: Valid channel number -1"

  # 20. EE_AED_AED_TOP_CTL2
  - name: EE_AED_AED_TOP_CTL2
    offset: 0x85
    description: AED top control 2
    fields:
      - bits: "31"
        name: reg_ini_done_rst
        access: R/W
        default: "0x0"
        description: "reg_ini_done_rst,when enable will auto rst at init_done negedge"
      - bits: "30:24"
        name: reserved_30_24
        access: R/W
        default: "0x0"
        description: reserved
      - bits: "23"
        name: reg_mixer_req_sel2_en
        access: R/W
        default: "0x0"
        description: reg_mixer_req_sel2_en
      - bits: "22"
        name: reg_mixer_req_sel1_en
        access: R/W
        default: "0x0"
        description: reg_mixer_req_sel1_en
      - bits: "21"
        name: reg_mixer_req_sel0_en
        access: R/W
        default: "0x0"
        description: reg_mixer_req_sel0_en
      - bits: "20"
        name: reg_mixer_sel
        access: R/W
        default: "0x0"
        description: "Reg_mixer_sel : 1means select mixer_req_b 0:means select mixer)req_a"
      - bits: "19:12"
        name: reg_ack_num
        access: R/W
        default: "0x0"
        description: "reg_ack_num: if needn't share buffer, set it as 0; if need share buffer , set it as TDMOUT/SPDIFOUT ch number;"
      - bits: "11"
        name: reg_req_sel2_en
        access: R/W
        default: "0x0"
        description: reg_req_sel2_en
      - bits: "10:8"
        name: reg_req_sel2
        access: R/W
        default: "0x0"
        description: "reg_req_sel2: 0: tdmout_a; 1: tdmout_b; 2: tdmout_c; 3: spdifout; 4: spdifout_b; 5: reserved; 6: reserved; 7: reserved;"
      - bits: "7"
        name: reg_req_sel1_en
        access: R/W
        default: "0x0"
        description: reg_req_sel1_en
      - bits: "6:4"
        name: reg_req_sel1
        access: R/W
        default: "0x0"
        description: "reg_req_sel1: 0: tdmout_a; 1: tdmout_b; 2: tdmout_c; 3: spdifout; 4: spdifout_b; 5: reserved; 6: reserved; 7: reserved;"
      - bits: "3"
        name: reg_req_sel0_en
        access: R/W
        default: "0x0"
        description: reg_req_sel0_en
      - bits: "2:0"
        name: req_req_sel0
        access: R/W
        default: "0x0"
        description: "req_req_sel0: 0: tdmout_a; 1: tdmout_b; 2: tdmout_c; 3: spdifout; 4: spdifout_b; 5: reserved; 6: reserved; 7: reserved;"

  # 21. EE_AED_AED_TOP_ST
  - name: EE_AED_AED_TOP_ST
    offset: 0x86
    description: AED top status
    fields:
      - bits: "29:20"
        name: tofifo_dat_buf_valid_num
        access: RO
        default: "0x0"
        description: tofifo_dat_buf_valid_num
      - bits: "19:10"
        name: frddr_dat_buf_valid_num
        access: RO
        default: "0x0"
        description: frddr_dat_buf_valid_num
      - bits: "9"
        name: r_frddr_init_done
        access: RO
        default: "0x0"
        description: r_frddr_init_done
      - bits: "8"
        name: frddr_start
        access: RO
        default: "0x0"
        description: frddr_start
      - bits: "7:4"
        name: afifo_in_cnt
        access: RO
        default: "0x0"
        description: afifo_in_cnt
      - bits: "3:0"
        name: afifo_out_cnt
        access: RO
        default: "0x0"
        description: afifo_out_cnt
