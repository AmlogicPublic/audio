  - name: MST_{X}_SCLK_CTRL0
    instances: [A, B, C, D, E, F]
    offsets: { A: 0x10, B: 0x12, C: 0x14, D: 0x16, E: 0x18, F: 0x1a }
    fields:
      - bits: "31"
        name: clk_in_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: clk_out_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "29:20"
        name: sclk_div
        access: R/W
        default: "0x000"
        description: "sclk = mclk/(sclk_div+1)"
      - bits: "19:10"
        name: lrclk_hi
        access: R/W
        default: "0x000"
        description: "duty cycle of LRCLK"
      - bits: "9:0"
        name: lrclk_div
        access: R/W
        default: "0x000"
        description: "lrclk = sclk/(lrclk_div+1)"

