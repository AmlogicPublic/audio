        condition: { macro_path: [ "pcpd_mon", "A", "imp" ], eq: 1 }
      - bits: "8"
        name: locker_b
        access: R/W
        default: "0"
        description: "locker_b clk gate"
        condition: { macro_path: [ "locker", "B", "imp" ], eq: 1 }
      - bits: "7"
        name: resampleb_old
        access: R/W
        default: "0"
        description: "resampleb_old clk gate"
        condition: { macro_path: [ "resample", "C", "imp" ], eq: 1 }
      - bits: "6"
        name: earcrx
        access: R/W
        default: "0"
        description: "earcrx clk gate"
        condition: { macro_path: [ "earcrx", "imp" ], eq: 1 }
      - bits: "5"
        name: earctx
        access: R/W
        default: "0"
        description: "earctx clk gate"
        condition: { macro_path: [ "earctx", "imp" ], eq: 1 }
      - bits: "4"
        name: toddr_e
        access: R/W
        default: "0"
        description: "toddrE clk gate"
        condition: { macro_path: [ "toddr", "E", "imp" ], eq: 1 }
      - bits: "3"
        name: frddr_e
        access: R/W
        default: "0"
        description: "frddrE clk gate"
        condition: { macro_path: [ "frddr", "E", "imp" ], eq: 1 }
      - bits: "2"
        name: loopback_b
        access: R/W
        default: "0"
        description: "loopbackB clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "loopback", "B", "imp" ], eq: 1 }
      - bits: "1"
        name: toddr_d
        access: R/W
        default: "0"
        description: "toddrd clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "toddr", "D", "imp" ], eq: 1 }
      - bits: "0"
        name: frddr_d
        access: R/W
        default: "0"
        description: "frddrd clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "frddr", "D", "imp" ], eq: 1 }

  - name: MCLK_{X}_CTRL
    instances: [ A, B, C, D, E, F ]
    offsets: { A: 0x2, B: 0x3, C: 0x4, D: 0x5, E: 0x6, F: 0x7 }
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "mclk = pll/(clk_div+1)"

    description: master clock control register
  - name: SW_RESET0
    offset: 0xa
    description: software reset control register
    fields:
      - bits: "31"
        name: frhdmirx
        access: R/W
        default: "0"
        description: "frhdmirx soft reset"
        condition: { macro_path: [ "hdmirx", "A", "imp" ], eq: 1 }
      - bits: "30"
        name: fratv
        access: R/W
        default: "0"
        description: "fratv soft reset"
        condition: { macro_path: [ "atv", "imp" ], eq: 1 }
      - bits: "29"
        name: spdifin_lb
        access: R/W
        default: "0"
        description: "spdifin_lb soft reset"
        condition: { macro_path: [ "spdifin", "LB_A", "imp" ], eq: 1 }
      - bits: "28"
        name: locker
        access: R/W
        default: "0"
        description: "locker soft reset"
        condition: { macro_path: [ "locker", "A", "imp" ], eq: 1 }
      - bits: "27"
        name: tovad
        access: R/W
        default: "0"
        description: "tovad soft reset"
        condition: { macro_path: [ "voice", "imp" ], eq: 1 }
      - bits: "26"
        name: resampleb
        access: R/W
        default: "0"
        description: "resampleB soft reset"
        condition: { macro_path: [ "resample", "B", "imp" ], eq: 1 }
      - bits: "25"
        name: clk_tree
        access: R/W
