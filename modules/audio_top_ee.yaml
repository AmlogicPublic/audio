        description: "tdmouta clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "tdmout", "A", "imp" ], eq: 1 }
      - bits: "5"
        name: tdmin_lb
        access: R/W
        default: "0"
        description: "tdminlb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "tdmin", "LB_A", "imp" ], eq: 1 }
      - bits: "4"
        name: tdmin_c
        access: R/W
        default: "0"
        description: "tdminc clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "tdmin", "C", "imp" ], eq: 1 }
      - bits: "3"
        name: tdmin_b
        access: R/W
        default: "0"
        description: "tdminb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "tdmin", "B", "imp" ], eq: 1 }
      - bits: "2"
        name: tdmin_a
        access: R/W
        default: "0"
        description: "tdmina clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "tdmin", "A", "imp" ], eq: 1 }
      - bits: "1"
        name: pdm
        access: R/W
        default: "0"
        description: "pdm clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "pdm", "A", "imp" ], eq: 1 }
      - bits: "0"
        name: ddr_arb
        access: R/W
        default: "0"
        description: "ddr_arb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "ddr_arb", "imp" ], eq: 1 }

  - name: CLK_GATE_EN1
    offset: 0x1
    description: clock gate enable register
    fields:
      - bits: "19"
        name: mixer
        access: R/W
        default: "0"
        description: "mixer clk gate"
        condition: { macro_path: [ "mixer", "imp" ], eq: 1 }
      - bits: "15"
        name: pcpd_mon
        access: R/W
        default: "0"
