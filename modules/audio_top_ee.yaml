      reg_chnum_id)"
    condition: { macro_path: [ "loopback", "B", "imp" ], eq: 1 }
  - bits: "25"
    name: loopback_b_insert_chnum_sync_err1
    default: "0"
    description: "LOOPBACK_B INSERT DATA, CHNUM_SYNC_ERR1: detect write new ch when
      pop buffer"
    condition: { macro_path: [ "loopback", "B", "imp" ], eq: 1 }
  - bits: "24"
    name: loopback_b_insert_chnum_sync_err0
    default: "0"
    description: "LOOPBACK_B INSERT DATA, CHNUM_SYNC_ERR0: miss CH (cur_chnum_id !=
      reg_chnum_id)"
    condition: { macro_path: [ "loopback", "B", "imp" ], eq: 1 }
  - bits: "23"
    name: resample_a_chnum_sync_err1
    default: "0"
    description: "RESAMPLE_A CHNUM_SYNC_ERR1: detect write new ch when pop buffer"
    condition: { macro_path: [ "resample", "A", "imp" ], eq: 1 }
  - bits: "22"
    name: resample_a_chnum_sync_err0
    default: "0"
    description: "RESAMPLE_A CHNUM_SYNC_ERR0: miss CH (cur_chnum_id != reg_chnum_id)"
    condition: { macro_path: [ "resample", "A", "imp" ], eq: 1 }
  - bits: "21"
    name: resample_b_chnum_sync_err1
    default: "0"
    description: "RESAMPLE_B CHNUM_SYNC_ERR1: detect write new ch when pop buffer"
    condition: { macro_path: [ "resample", "B", "imp" ], eq: 1 }
  - bits: "20"
    name: resample_b_chnum_sync_err0
    default: "0"
    description: "RESAMPLE_B CHNUM_SYNC_ERR0: miss CH (cur_chnum_id != reg_chnum_id)"
    condition: { macro_path: [ "resample", "B", "imp" ], eq: 1 }
  - bits: "17"
    name: spdifin_reserved
    default: "0"
    description: "SPDIFIN reserved"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "16"
    name: spdifin_afifo_overflow
    default: "0"
    description: "SPDIFIN afifo overflow"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "15"
    name: spdifin_cyc_cnt_err_min
    default: "0"
    description: "SPDIFIN cyc_cnt err, < min"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "14"
    name: spdifin_cyc_cnt_err_max
    default: "0"
    description: "SPDIFIN cyc_cnt err, > max"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "13"
    name: spdifin_parity_err
    default: "0"
    description: "SPDIFIN parity_err"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "12"
    name: spdifin_bit_cnt_err_gt64
    default: "0"
