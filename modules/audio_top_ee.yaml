registers0:
  # ============================================================================
  # CLK/RESET Registers
  # ============================================================================
  - name: CLK_GATE_EN0
    offset: 0x0
    description: clock gate enable register
    fields:
      - bits: "31"
        name: frhdmirx
        access: R/W
        default: "0"
        description: "frhdmirx clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "hdmirx", "A", "imp" ], eq: 1 }
      - bits: "30"
        name: fratv
        access: R/W
        default: "0"
        description: "fratv clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "atv", "imp" ], eq: 1 }
      - bits: "29"
        name: spdifin_lb
        access: R/W
        default: "0"
        description: "spdifin_lb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "spdifin", "LB_A", "imp" ], eq: 1 }
      - bits: "28"
        name: audio_locker
        access: R/W
        default: "0"
        description: "audio locker clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "locker", "A", "imp" ], eq: 1 }
      - bits: "27"
        name: tovad
        access: R/W
        default: "0"
        description: "tovad clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "voice", "imp" ], eq: 1 }
      - bits: "26"
        name: resampleb
        access: R/W
        default: "0"
        description: "resampleB clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "resample", "B", "imp" ], eq: 1 }
      - bits: "22"
        name: eqdrc
        access: R/W
        default: "0"
        description: "eqdrc clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "eqdrc", "imp" ], eq: 1 }
      - bits: "21"
        name: spdifout_b
        access: R/W
        default: "0"
        description: "spdifoutB clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "spdifout", "B", "imp" ], eq: 1 }
      - bits: "18"
        name: resamplea
        access: R/W
        default: "0"
        description: "resampleA clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "resample", "A", "imp" ], eq: 1 }
      - bits: "17"
        name: spdifout
        access: R/W
        default: "0"
        description: "spdifout clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "spdifout", "A", "imp" ], eq: 1 }
      - bits: "16"
        name: spdifin
        access: R/W
        default: "0"
        description: "spdifin clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
      - bits: "15"
        name: loopback_a
        access: R/W
        default: "0"
        description: "loopbackA clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "loopback", "A", "imp" ], eq: 1 }
      - bits: "14"
        name: toddr_c
        access: R/W
        default: "0"
        description: "toddrc clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "toddr", "C", "imp" ], eq: 1 }
      - bits: "13"
        name: toddr_b
        access: R/W
        default: "0"
        description: "toddrb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "toddr", "B", "imp" ], eq: 1 }
      - bits: "12"
        name: toddr_a
        access: R/W
        default: "0"
        description: "toddra clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "toddr", "A", "imp" ], eq: 1 }
      - bits: "11"
        name: frddr_c
        access: R/W
        default: "0"
        description: "frddrc clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "frddr", "C", "imp" ], eq: 1 }
      - bits: "10"
        name: frddr_b
        access: R/W
        default: "0"
        description: "frddrb clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "frddr", "B", "imp" ], eq: 1 }
      - bits: "9"
        name: frddr_a
        access: R/W
        default: "0"
        description: "frddra clk gate; 0:disable; 1:enable"
        condition: { macro_path: [ "frddr", "A", "imp" ], eq: 1 }
      - bits: "8"
        name: tdmout_c
        access: R/W
