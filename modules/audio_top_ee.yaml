    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "10"
    name: spdifin_xyz_err
    default: "0"
    description: "SPDIFIN xyz_err"
    condition: { macro_path: [ "spdifin", "A", "imp" ], eq: 1 }
  - bits: "9"
