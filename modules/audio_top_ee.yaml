module: AUDIO_TOP_EE

# ==============================================================================
# Field templates for EXCEPTION IRQ registers (64 exception irqs)
# reg0 contains irq bits 31:0, reg1 contains irq bits 63:32
# ==============================================================================
exception_irq_fields_0: &exception_irq_fields_0
  - bits: "31"
    name: loopback_a_orig_chnum_sync_err1
    default: "0"
    description: "LOOPBACK_A ORIG DATA, CHNUM_SYNC_ERR1: detect write new ch when
      pop buffer"
    condition: { macro_path: [ "loopback", "A", "imp" ], eq: 1 }
  - bits: "30"
    name: loopback_a_orig_chnum_sync_err0
    default: "0"
    description: "LOOPBACK_A ORIG DATA, CHNUM_SYNC_ERR0: miss CH (cur_chnum_id !=
      reg_chnum_id)"
    condition: { macro_path: [ "loopback", "A", "imp" ], eq: 1 }
  - bits: "29"
    name: loopback_a_insert_chnum_sync_err1
    default: "0"
    description: "LOOPBACK_A INSERT DATA, CHNUM_SYNC_ERR1: detect write new ch when
      pop buffer"
    condition: { macro_path: [ "loopback", "A", "imp" ], eq: 1 }
  - bits: "28"
