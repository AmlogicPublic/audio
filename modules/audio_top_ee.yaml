    fields:
      - bits: "31:28"
        name: sclk_ph0_sel
        access: R/W
        default: "0x0"
        description: "select from sclk_delay_line(depth is 16)"
      - bits: "27:24"
        name: lrclk_ph0_sel
        access: R/W
        default: "0x0"
        description: "select from lrclk_delay_line(depth is 16)"
      - bits: "23:20"
        name: sclk_ph1_sel
        access: R/W
        default: "0x0"
        description: "select from sclk_delay_line(depth is 16)"
      - bits: "19:16"
