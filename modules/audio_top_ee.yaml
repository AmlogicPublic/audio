        access: R/W
        default: "0x0"
        description: "select from lrclk_delay_line(depth is 16)"
      - bits: "5:0"
        name: clk_inv
        access: R/W
        default: "0x00"
        description: "[5]:lrclk_ph2; [4]:sclk_ph2; [3]:lrclk_ph1; [2]:sclk_ph1; [1]:lrclk_ph0; [0]:sclk_ph0"

