  - name: MCLK_{X}_CTRL
    instances: [A, B, C, D, E, F]
    offsets: { A: 0x02, B: 0x03, C: 0x04, D: 0x05, E: 0x06, F: 0x07 }
    fields:
      - bits: "31"
        name: clk_en
        access: R/W
        default: "0"
        description: "0:disable; 1:enable"
      - bits: "30"
        name: force_oscin
        access: R/W
        default: "0"
        description: "0:disable; 1:force clock source as oscin(24M)"
      - bits: "27:24"
        name: clk_sel
        access: R/W
        default: "0x0"
        description: "0~7:i_other_pll_a~h"
      - bits: "15:0"
        name: clk_div
        access: R/W
        default: "0x0000"
        description: "mclk = pll/(clk_div+1)"

